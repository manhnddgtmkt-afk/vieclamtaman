<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Việc Làm Tâm An</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tâm An">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --navy:#1F3864; --on-navy:#FFFFFF; --bg:#E9EDF3; --card:#FFFFFF; --line:#C9D3E0; --soft:#F3F6FA; --tint:#DDEBF7;
  --fg:#16233A; --muted:#5E6B80; --good:#1E8A4C; --good-bg:#E3F4EA; --warn:#B86E00; --warn-bg:#FFF4D6; --bad:#C62828; --bad-bg:#FDE7E7;
  --blue:#2F6FD1; --cta:#1F3864; --font:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#16264A; --on-navy:#F2F5FA; --bg:#0F1522; --card:#182132; --line:#2C3A52; --soft:#1E2940; --tint:#1F3354;
  --fg:#E6ECF5; --muted:#9AA8BF; --good:#4CC27F; --good-bg:#16342A; --warn:#F0B14A; --warn-bg:#3A2E14; --bad:#FF7070; --bad-bg:#3D1C1F; --blue:#6EA2FF; --cta:#3B6FD0; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#16264A; --on-navy:#F2F5FA; --bg:#0F1522; --card:#182132; --line:#2C3A52; --soft:#1E2940; --tint:#1F3354;
  --fg:#E6ECF5; --muted:#9AA8BF; --good:#4CC27F; --good-bg:#16342A; --warn:#F0B14A; --warn-bg:#3A2E14; --bad:#FF7070; --bad-bg:#3D1C1F; --blue:#6EA2FF; --cta:#3B6FD0; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.app{max-width:480px;margin:0 auto;min-height:100vh}
/* đăng nhập */
.lg{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 85% 0%,#2B4F8C 0%,#1F3864 45%,#14264A 100%);color:#fff;overflow:hidden;position:relative}
.lg-art{position:absolute;right:-90px;top:-70px;width:340px;height:340px;opacity:.13;pointer-events:none}
.lg-top{padding:56px 24px 26px;position:relative}
.mark{width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,#fff,#DDE7F6);color:#1F3864;display:grid;place-items:center;font-weight:800;font-size:21px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.lg-top h1{margin:18px 0 2px;font-size:26px;font-weight:800;letter-spacing:.6px}
.lg-top p{margin:0;opacity:.78;font-size:14px}
.lg-card{margin-top:auto;background:var(--bg);color:var(--fg);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-width:480px;width:100%;align-self:center}
.lg-card h2{margin:0;font-size:19px}
.inp{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:19px;letter-spacing:.5px}
.inp:focus{border-color:var(--blue);outline:none}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px;background:var(--cta);color:#fff;width:100%}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:11px}
.lg-user{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;background:var(--tint);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:18px;flex:0 0 auto}
.dots{display:flex;gap:16px;justify-content:center;margin:6px 0 2px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--cta);border-color:var(--cta)}
.dots.sai{animation:lac .35s}
@keyframes lac{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;padding:0 10px}
.pad button{height:64px;width:64px;border-radius:50%;border:0;background:var(--card);box-shadow:0 0 0 1px var(--line) inset;font-size:25px;font-weight:600;justify-self:center}
.pad button:active{background:var(--tint)}
.pad .tx{background:none;box-shadow:none;font-size:14px;color:var(--blue);width:auto}
.msg{text-align:center;font-size:13.5px;min-height:19px;font-weight:600;color:var(--bad)}
.link{background:none;border:0;color:var(--blue);font-weight:600;padding:4px}
/* khung chính */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--on-navy);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.top h2{margin:0;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{opacity:.8;font-size:12px}
.meBtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--on-navy);color:var(--navy);font-weight:800;flex:0 0 auto}
.back{border:0;background:none;color:var(--on-navy);font-size:28px;padding:0 6px 0 0;line-height:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chip{border:1px solid rgba(255,255,255,.35);background:none;color:var(--on-navy);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--on-navy);color:var(--navy);border-color:var(--on-navy)}
.search{width:100%;margin-top:10px;padding:11px 14px;border-radius:12px;border:0;font-size:16px;background:rgba(255,255,255,.95);color:#16233A}
main{padding:14px 16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.fl{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.fl button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.fl button.on{background:var(--cta);color:#fff;border-color:var(--cta)}
.meta{font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;text-align:left;width:100%}
.it .nm{font-weight:700}
.it .sub{font-size:12.5px;color:var(--muted)}
.it .amt{margin-left:auto;text-align:right;font-weight:700;white-space:nowrap}
.it .amt small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn);margin-left:4px;vertical-align:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.big{font-size:26px;font-weight:800}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.g3 div{background:var(--soft);border-radius:10px;padding:8px}
.g3 span{display:block;font-size:11.5px;color:var(--muted)}
.g3 b{font-size:14px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts a{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:700;color:var(--fg);background:var(--soft)}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:42px;height:38px;font-size:18px}
.wk b{font-size:14px}
.slip{background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line);min-height:120px}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right;word-break:break-word}
.sk{height:62px;border-radius:14px;background:linear-gradient(90deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:sk 1s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.sheet{position:fixed;inset:0;background:rgba(10,18,34,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.sheet h3{margin:0;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#16233A;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;text-align:center}

/* thanh dưới + các phần mới */
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;max-width:160px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0}
.nav button i{font-style:normal;font-size:20px;filter:grayscale(1);opacity:.7}
.nav button.on{color:var(--cta)}
.nav button.on i{filter:none;opacity:1}
.tag.moi{background:var(--tint);color:var(--blue)}
.lb{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:-6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2 .lb{display:block;margin:0 0 4px}
.sheet .inp{font-size:16px;padding:12px 14px}
.btn.xn{background:var(--warn);color:#fff}
.acts .btn{flex:1}
.ul{display:flex;flex-direction:column;margin-top:8px}
.ur{display:grid;grid-template-columns:52px 1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.ur .d{color:var(--muted)}
.ur .l.u{color:var(--warn);font-weight:600}
.ur .l.t{color:var(--good);font-weight:600}
.ur .g{grid-column:2/4;font-size:12.5px;color:var(--muted)}
.hero .big{font-size:30px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tc{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tc span{font-size:12px;color:var(--muted);font-weight:600}
.tc b{font-size:18px}
.tc small{font-size:11.5px;color:var(--muted)}
.tc.good{border-top-color:var(--good)} .tc.bad{border-top-color:var(--bad)} .tc.bad b{color:var(--bad)} .tc.orange{border-top-color:#D9730D} .tc.gray{border-top-color:#8A93A1}
details.mc summary{list-style:none;cursor:pointer}
details.mc summary::-webkit-details-marker{display:none}
details.mc summary b::after{content:" ▾";color:var(--muted)}
details.mc[open] summary b::after{content:" ▴"}
.mb{border-top:1px solid var(--line);padding:9px 0}
.mb .mt{font-weight:700;margin-bottom:4px}
.mb.tong{background:var(--tint);margin:0 -14px;padding:9px 14px}
.mb .kv{font-size:13px;gap:3px 12px}
.mr{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.mr.nt{color:var(--muted);font-size:12.5px;display:block}
.am{color:var(--bad)}
.it.so{cursor:default}
.kv.so{grid-template-columns:minmax(0,1fr) auto}
.kv b.num{white-space:nowrap}
#them{white-space:nowrap;flex:0 0 auto}
.note:not(.warn):not(.bad){background:var(--soft);color:var(--muted)}

html,body{overflow-x:hidden}
main,.card{min-width:0}
.card,.mb,.dg{overflow-wrap:anywhere}
.mr1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:600}
.mr1 b{white-space:nowrap}
.dg{font-size:12.5px;color:var(--muted);margin-top:3px}
.inp.ky{width:auto;font-size:15px;padding:9px 12px;font-weight:700;background:var(--warn-bg)}
pre.log{white-space:pre-wrap;font-size:12px;background:var(--soft);border-radius:10px;padding:10px;max-height:220px;overflow:auto;margin:0}

/* tiến trình */
.tt{position:fixed;left:0;right:0;top:0;z-index:80;pointer-events:none;opacity:0;transition:opacity .2s}
.tt.on{opacity:1}
.ttbar{height:3px;background:transparent}
.ttbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4CC27F,#6EA2FF);transition:width .12s linear;box-shadow:0 0 8px rgba(110,162,255,.7)}
.ttpill{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(22,35,58,.94);color:#fff;border-radius:999px;padding:6px 14px 6px 6px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.3);white-space:nowrap}
.ttpill svg{width:34px;height:34px;transform:rotate(-90deg)}
.ttpill circle{fill:none;stroke-width:4}
.ttpill .n{stroke:rgba(255,255,255,.18)}
.ttpill .v{stroke:#4CC27F;stroke-dasharray:94.2;stroke-dashoffset:94.2;stroke-linecap:round;transition:stroke-dashoffset .12s linear}
.ttpill span{position:absolute;left:6px;width:34px;text-align:center;font-size:9.5px;font-weight:700}
.ttpill b{font-weight:600}
/* chọn tuần */
.tuans{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tch{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 11px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:96px}
.tch b{font-size:13.5px}
.tch small{font-size:11.5px;color:var(--muted)}
.tch.tra{border-color:var(--good)}
.tch.on{background:var(--cta);border-color:var(--cta);color:#fff}
.tch.on small{color:rgba(255,255,255,.8)}

/* việc hôm nay */
.vhc{display:flex;flex-direction:column;gap:6px}
.vh{display:flex;align-items:center;gap:6px;border:0;background:var(--soft);border-radius:10px;padding:10px 12px;text-align:left;font-size:14px;width:100%}
.vh i{margin-left:auto;font-style:normal;color:var(--muted);font-size:18px}
.vh.nb{background:var(--warn-bg);color:var(--warn);font-weight:600}
/* lịch bảng công */
.lich2{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.lh,.lw{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.lh span{text-align:center;font-size:11.5px;color:var(--muted);font-weight:700}
.ld{border:1.5px solid transparent;border-radius:9px;padding:5px 0;display:flex;flex-direction:column;align-items:center;background:var(--soft);min-height:46px}
.ld b{font-size:13px}.ld small{font-size:11px;color:var(--muted)}
.ld.ngay{background:#DCEBF9;color:#16233A}.ld.dem{background:#E6DCF2;color:#16233A}.ld.ngay small,.ld.dem small{color:#3A4A66}
.ld.loi{border-color:#D9730D}
.ld.ngoai{opacity:.3;background:none}
.lgd{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
.lgd i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.lgd i.ngay{background:#DCEBF9}.lgd i.dem{background:#E6DCF2}.lgd i.nghi{background:var(--soft);border:1px solid var(--line)}.lgd i.loi{border:2px solid #D9730D}
.lgd i.in{background:var(--good)}.lgd i.out{background:var(--bad)}
textarea.inp{font-size:15px;resize:vertical}
/* bàn phím tiền */
.npb{display:flex;flex-direction:column;gap:8px}
.nph{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
.nph span{font-size:24px;font-weight:800}.nph span.rong{color:var(--muted)}
.nph .link:disabled{opacity:.35}
.np{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.np button{height:50px;border-radius:12px;border:0;background:var(--card);box-shadow:0 0 0 1px var(--line) inset;font-size:21px;font-weight:600}
.np button:active{background:var(--tint)}
/* dòng tiền 6 tuần */
.dt{border-top:1px solid var(--line);padding:9px 0}
.dth{display:flex;justify-content:space-between;font-size:14px}
.bars{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.bars i{display:block;height:7px;border-radius:4px;min-width:2px}
.bars i.in{background:var(--good)}.bars i.out{background:var(--bad)}
/* tài khoản */
.avw{position:relative;cursor:pointer;flex:0 0 auto}
.avw span{position:absolute;right:-4px;bottom:-4px;font-size:15px;background:var(--card);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.av.img{object-fit:cover;padding:0}
.meBtn{overflow:hidden;padding:0}
.meBtn img{width:100%;height:100%;object-fit:cover;display:block}
.sw{display:flex;gap:8px;align-items:center;font-size:14.5px}
.sw input{width:20px;height:20px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(function () {
  'use strict';
  var S = { t: null, toi: null, cty: null, data: {}, loc: 'all', q: '', hs: null, tqNhom: null };
  var $app = document.getElementById('app');

  // ---------- tiện ích ----------
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function vnd(x) { x = Math.round(Number(x) || 0); return (x < 0 ? '−' : '') + String(Math.abs(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function kd(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase(); }
  function chu(ten) { var p = String(ten || '?').trim().split(/\s+/); return p[p.length - 1].charAt(0).toUpperCase(); }
  function luu(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } }
  function doc(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function toast(m) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2600); }
  function serialDate(n) { return new Date(Math.round((n - 25569) * 864e5)); }
  function ddmm(d, nam) { function p(x) { return (x < 10 ? '0' : '') + x; } return p(d.getUTCDate()) + '/' + p(d.getUTCMonth() + 1) + (nam ? '/' + d.getUTCFullYear() : ''); }

  // ---------- gọi máy chủ ----------
  // ---------- thanh tiến trình (ước tính theo thời gian thường mất của từng việc) ----------
  var VIEC_TG = { hoi: [3, 'Đang kiểm tra'], vao: [4, 'Đang đăng nhập'], toi: [3, 'Đang mở'], ds: [5, 'Đang tải danh sách'], phieu: [4, 'Đang tính phiếu lương'],

        (o.ghiChu ? '<div class="note">' + esc(o.ghiChu) + '</div>' : '') +
        '<div class="meta" style="text-align:center">' + esc(o.capNhat) + ' · <a href="#" id="tnMoi" style="color:var(--blue)">làm mới</a></div>';
      document.getElementById('tnMoi').onclick = function (e) { e.preventDefault(); this.textContent = 'đang tải…'; taiTN(true); };
    })();
  }

  // ---------- thu chi + quỹ ----------
  var QUY = null;
  function veQuy() {
    khung('Thu chi', 'Quỹ công ty do thủ quỹ giữ', '', '<div class="sk" style="height:140px"></div><div class="sk" style="height:300px"></div>');
    if (QUY) hienQuy(QUY);
    taiQuy(false);
  }
  function taiQuy(moi) {
    apiT({ v: 'quy', moi: moi ? 1 : 0 }).then(hienQuy, function (e) { var t = document.getElementById('than'); if (t && !QUY) t.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }
  function hienQuy(o) {
    (function () {
      var t = document.getElementById('than'); if (!t || S.tab !== 'quy') return;
      if (o.loi) { t.innerHTML = '<div class="empty">' + esc(o.loi) + '</div>'; return; }
      QUY = o;
      var m5 = o.muc5, quy = null, khac = [];
      if (m5) m5.dong.forEach(function (x) { if (/^Số dư quỹ/i.test(x[0])) quy = x; else khac.push(x); });
      var so = o.so;
      t.innerHTML = '<div class="card hero"><div class="meta">Số dư quỹ hiện tại</div><div class="big num">' + esc(quy ? quy[1] : '–') + '</div><div class="meta">' + esc(quy ? quy[2] || '' : '') + '</div>' +
        '<div class="g3"><div><span>Tổng thu (sổ)</span><b class="num">' + esc(String(so.tongThu || '').replace(/^Tổng thu:\s*/, '')) + '</b></div><div><span>Tổng chi (sổ)</span><b class="num">' + esc(String(so.tongChi || '').replace(/^Tổng chi:\s*/, '')) + '</b></div><div><span>Nợ người ứng</span><b class="num">' + esc(so.noUng || '0') + '</b></div></div></div>' +
        (so.loi && !/Không có dòng lỗi/.test(so.loi) ? '<div class="note bad">' + esc(so.loi) + '</div>' : '') +
        '<div class="row sp"><b>Sổ thu chi</b><button class="btn sm" id="gso">+ Ghi khoản</button></div>' +
        '<input class="inp" id="qso" type="search" placeholder="Tìm khoản, nội dung, người…" style="font-size:15px;padding:11px 14px">' +
        '<div class="list" id="lso"></div>' +
        (m5 ? '<div class="card"><b>' + esc(m5.tieu.split('    ')[0]) + '</b><div class="kv so" style="margin-top:8px">' + khac.map(function (x) { return '<span>' + esc(x[0]) + '<br><small class="meta">' + esc(x[2] || '') + '</small></span><b class="num">' + esc(x[1]) + '</b>'; }).join('') + '</div></div>' : '') +
        '<div class="meta" style="text-align:center">' + esc(o.capNhat) + ' · <a href="#" id="qMoi" style="color:var(--blue)">làm mới</a></div>';
      document.getElementById('qMoi').onclick = function (e) { e.preventDefault(); this.textContent = 'đang tải…'; taiQuy(true); };
      document.getElementById('gso').onclick = moGhiSo;
      var q = document.getElementById('qso'); q.oninput = function () { veSo(q.value); };
      veSo('');
    })();
  }
  function veSo(q) {
    var l = document.getElementById('lso'); if (!l || !QUY) return;
    var k = kd(q).trim(), ds = QUY.so.dong.filter(function (x) { return !k || kd([x.khoan, x.nd, x.nguoi, x.dt, x.ngay].join(' ')).indexOf(k) >= 0; }).slice(0, 80);
    l.innerHTML = ds.length ? ds.map(function (x) {
      var thu = /^thu/i.test(x.loai);
      return '<div class="it so"><div style="min-width:0"><div class="nm">' + esc(x.khoan) + '</div><div class="sub">' + esc([x.ngay, x.nguoi, x.dt, x.thang].filter(String).join(' · ')) + '</div>' +
        (x.nd ? '<div class="sub">' + esc(x.nd) + '</div>' : '') + (x.kt ? '<div class="sub" style="color:var(--bad)">' + esc(x.kt) + '</div>' : '') + '</div>' +
        '<div class="amt num" style="color:' + (thu ? 'var(--good)' : 'inherit') + '">' + (thu ? '+' : '−') + esc(x.so) + '</div></div>';
    }).join('') : '<div class="empty">Không có khoản nào khớp.</div>';
  }
  function moGhiSo() {
    if (!QUY) return;
    var so = QUY.so, hn = new Date(), iso = hn.getFullYear() + '-' + ('0' + (hn.getMonth() + 1)).slice(-2) + '-' + ('0' + hn.getDate()).slice(-2);
    var thangNay = hn.getFullYear() + '-T' + ('0' + (hn.getMonth() + 1)).slice(-2);
    var toi = so.nguoiChi.filter(function (x) { return kd(x) === kd(S.toi.ten); })[0] || so.nguoiChi[1] || so.nguoiChi[0] || '';
    var sh = moSheet('<h3>Ghi khoản vào sổ thu chi</h3>' +
      '<label class="lb">Khoản</label><select class="inp" id="sK"><option value="">Chọn khoản…</option>' + so.khoan.map(function (k, i) { return '<option value="' + i + '">' + esc(k.ten) + ' (' + esc(k.loai) + ')</option>'; }).join('') + '</select>' +
      '<div class="meta" id="sGy"></div>' +
      '<div id="sSo"></div>' +
      '<div class="g2"><div><label class="lb">Ngày</label><input class="inp" id="sNg" type="date" value="' + iso + '"></div><div><label class="lb">Người chi</label><select class="inp" id="sNc">' + so.nguoiChi.map(function (x) { return '<option' + (x === toi ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select></div></div>' +
      '<div class="g2"><div><label class="lb">Công ty / người nhận</label><select class="inp" id="sDt"><option value="">–</option>' + so.doiTuong.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select></div>' +
      '<div><label class="lb">Tính cho tháng</label><select class="inp" id="sTh"><option value="">–</option>' + so.thang.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select></div></div>' +
      '<input class="inp" id="sNd" placeholder="Nội dung">' +
      '<div class="msg" id="sm"></div><button class="btn" id="sok">Ghi</button><button class="btn ghost" id="shuy">Thôi</button>');
    var lay = banPhim('sSo').lay;
    document.getElementById('shuy').onclick = function () { sh.remove(); };
    document.getElementById('sK').onchange = function () {
      var k = so.khoan[Number(this.value)]; document.getElementById('sGy').textContent = k ? k.goiY || '' : '';
      if (k && k.thangBuoc && !document.getElementById('sTh').value) document.getElementById('sTh').value = so.thang.indexOf(thangNay) >= 0 ? thangNay : '';
    };
    document.getElementById('sok').onclick = function () {
      var k = so.khoan[Number(document.getElementById('sK').value)], m = document.getElementById('sm'), btn = this, tien = lay();
      if (!k) { m.textContent = 'Chọn khoản.'; return; }
      if (!tien) { m.textContent = 'Nhập số tiền.'; return; }
      var ngay = document.getElementById('sNg').value.split('-').reverse().join('/');
      if (!confirmLan(btn, k.ten + ' ' + vnd(tien) + ' – bấm lần nữa để ghi')) return;
      btn.disabled = true; btn.textContent = 'Đang ghi…';
      apiT({ v: 'ghiSo', dong: { khoan: k.ten, so: tien, ngay: ngay, nguoi: document.getElementById('sNc').value, dt: document.getElementById('sDt').value, thang: document.getElementById('sTh').value, nd: document.getElementById('sNd').value } }).then(function (o) {
        if (o.loi) { btn.disabled = false; btn.textContent = 'Ghi'; m.textContent = o.loi; return; }
        sh.remove(); toast('Đã ghi vào sổ (dòng ' + o.dong + ')' + (o.kiemTra ? ' · ' + o.kiemTra : '')); veQuy();
      }, function (e) { btn.disabled = false; btn.textContent = 'Ghi'; m.textContent = e.message; });
    };
  }

  // ---------- tổng quan (chủ) ----------
  var TQ = null, TN = null;
  function veTQ() {
    khung('Tổng quan', 'Báo cáo tài chính và công nợ', '', '<div class="sk" style="height:200px"></div><div class="sk" style="height:300px"></div>');
    if (TQ) hienTQ(TQ);
    taiTQ({});
  }
  var dangTQ = false;
  function taiTQ(q) {
    if (dangTQ) return; dangTQ = true;
    q.v = 'tq';
    apiT(q).then(function (o) { dangTQ = false; if (!o.loi) TQ = o; hienTQ(o); }, function (e) {
      dangTQ = false; var t = document.getElementById('than'); if (t && !TQ) t.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; else toast(e.message); if (TQ) hienTQ(TQ);
    });
  }
  function laSo(v) { return /^[-−]?[\d,.]+%?$/.test(String(v).trim()) || String(v).trim() === '-'; }
  function vnSo(v) { var x = String(v || '').replace(/[^\d−-]/g, '').replace('−', '-'); return Number(x) || 0; }
  function ngayHan(v) {   // 'dd/mm' hoặc 'dd/mm/yyyy' -> Date (năm đoán theo hôm nay)
    var m = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/.exec(String(v || '').trim()); if (!m) return null;
    var hn = new Date(), y = m[3] ? Number(m[3]) : hn.getFullYear(), d = new Date(y, Number(m[2]) - 1, Number(m[1]));
    if (!m[3] && d < new Date(hn.getFullYear(), hn.getMonth() - 6, 1)) d.setFullYear(y + 1);
    return d;
  }
  function htmlMuc(m, mo) {
    var tieu = m.tieu.split(/\s{3,}/), dau = m.dau;
    return '<details class="card mc"' + (mo ? ' open' : '') + '><summary><b>' + esc(tieu[0]) + '</b>' + (tieu[1] ? '<div class="meta">' + esc(tieu.slice(1).join(' ')) + '</div>' : '') + '</summary>' +
      m.dong.map(function (r) {
        var ten = r[0], con = r.slice(1), co = con.some(String);
        if (!co) return '<div class="mr nt">' + esc(ten) + '</div>';
        var tong = /^(Tổng|Giờ công toàn bộ|Số dư)/.test(ten), so = [], chu = [];
        con.forEach(function (v, i) { if (!v) return; (laSo(v) ? so : chu).push([dau[i + 1] || '', v]); });
        if (!dau.length || so.length === 1) {
          return '<div class="mb' + (tong ? ' tong' : '') + '"><div class="mr1"><span>' + esc(ten) + '</span><b class="num' + (so[0] && /^[-−]\d/.test(so[0][1]) ? ' am' : '') + '">' + esc(so[0] ? so[0][1] : '') + '</b></div>' +
            chu.map(function (x) { return '<div class="dg">' + (x[0] ? esc(x[0]) + ': ' : '') + esc(x[1]) + '</div>'; }).join('') + '</div>';
        }
        return '<div class="mb' + (tong ? ' tong' : '') + '"><div class="mt">' + esc(ten) + '</div><div class="kv so">' +
          so.map(function (x) { return '<span>' + esc(x[0]) + '</span><b class="num' + (/^[-−]\d/.test(x[1]) ? ' am' : '') + '">' + esc(x[1]) + '</b>'; }).join('') + '</div>' +
          chu.map(function (x) { return '<div class="dg">' + (x[0] ? esc(x[0]) + ': ' : '') + esc(x[1]) + '</div>'; }).join('') + '</div>';
      }).join('') + '</details>';
  }
  // dòng tiền 6 tuần tới: chỉ gom các khoản đã có hạn trên báo cáo (mục 6 thu khách, mục 2 trả vendor), không tính thêm
  function dongTien6(o) {
    function tim(chu) { return o.muc.filter(function (m) { return m.tieu.indexOf(chu) === 0; })[0]; }
    var m6 = tim('6.'), m2 = tim('2.'), hn = new Date(); hn.setHours(0, 0, 0, 0);
    var t0 = new Date(hn); t0.setDate(t0.getDate() - ((t0.getDay() + 6) % 7));
    var tuan = []; for (var i = 0; i < 6; i++) { var a = new Date(t0); a.setDate(a.getDate() + 7 * i); var b = new Date(a); b.setDate(b.getDate() + 6); tuan.push({ a: a, b: b, thu: 0, chi: 0, ct: [] }); }
    var qua = { thu: 0, chi: 0 };
    function gom(m, cotTien, cotHan, loai) {
      if (!m) return; var iT = m.dau.indexOf(cotTien), iH = m.dau.indexOf(cotHan); if (iT < 0 || iH < 0) return;
      m.dong.forEach(function (r) {
        var d = ngayHan(r[iH]), so = vnSo(r[iT]); if (!d || !so) return;
        if (d < t0) { qua[loai] += so; return; }
        tuan.forEach(function (w) { if (d >= w.a && d <= w.b) { w[loai] += so; w.ct.push((loai === 'thu' ? '+ ' : '− ') + [r[0], r[1]].filter(String).join(' ') + ' ' + vnd(so)); } });
      });
    }
    gom(m6, 'Thực nhận dự kiến', 'Hạn thanh toán', 'thu');
    gom(m2, 'Còn phải trả', 'Hạn thanh toán', 'chi');
    var max = Math.max.apply(null, tuan.map(function (w) { return Math.max(w.thu, w.chi); }).concat([1]));
    function dm(d) { return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2); }
    return '<div class="card"><b>Dòng tiền dự kiến 6 tuần tới</b><div class="meta">Gom theo hạn thanh toán ở mục 6 (khách trả, thực nhận) và mục 2 (trả vendor). Chưa gồm lương công nhân và lương kinh doanh trả hằng tuần.</div>' +
      (qua.thu || qua.chi ? '<div class="note warn" style="margin-top:8px">Đã quá hạn: khách chưa trả ' + vnd(qua.thu) + (qua.chi ? ' · vendor chưa trả ' + vnd(qua.chi) : '') + '</div>' : '') +
      tuan.map(function (w, i) {
        return '<div class="dt"><div class="dth"><b>' + (i === 0 ? 'Tuần này' : 'Tuần ' + dm(w.a) + '–' + dm(w.b)) + '</b><span class="num ' + (w.thu - w.chi < 0 ? 'am' : '') + '">' + (w.thu || w.chi ? (w.thu - w.chi > 0 ? '+' : '') + vnd(w.thu - w.chi) : '–') + '</span></div>' +
          '<div class="bars"><i class="in" style="width:' + (100 * w.thu / max).toFixed(1) + '%"></i><i class="out" style="width:' + (100 * w.chi / max).toFixed(1) + '%"></i></div>' +
          (w.ct.length ? '<div class="dg">' + w.ct.map(esc).join('<br>') + '</div>' : '') + '</div>';
      }).join('') + '<div class="lgd"><span><i class="in"></i>Tiền vào</span><span><i class="out"></i>Tiền ra</span></div></div>';
  }
  function hienTQ(o) {
    (function () {
      var t = document.getElementById('than'); if (!t || S.tab !== 'tq') return;
      if (o.loi) { t.innerHTML = '<div class="empty">' + esc(o.loi) + '</div>'; return; }
      var mau = ['good', 'blue', 'good', 'gray', 'orange', 'orange'];
      var hn = new Date(), max = hn.getFullYear() + '-T' + ('0' + (hn.getMonth() + 1)).slice(-2);   // chỉ các tháng đã tới
      var ds = (o.thangDs && o.thangDs.length ? o.thangDs : [o.ky]).filter(function (x) { return x <= max || x === o.ky; }).reverse();
      var nhom = S.tqNhom || 'ln';
      function the(ids) { return '<div class="tg">' + ids.filter(function (i) { return o.the[i]; }).map(function (i) { var x = o.the[i], am = /^-/.test(x[1]); return '<div class="tc ' + (am ? 'bad' : mau[i] || 'blue') + '"><span>' + esc(x[0]) + '</span><b class="num">' + esc(x[1]) + '</b><small>' + esc(x[2]) + '</small></div>'; }).join('') + '</div>'; }
      function muc(ds2) { return o.muc.filter(function (m) { return ds2.some(function (p) { return m.tieu.indexOf(p) === 0; }); }).map(function (m, i) { return htmlMuc(m, i === 0); }).join(''); }
      var than = nhom === 'tien' ? the([4, 5]) + dongTien6(o) + muc(['5.', '6.'])
        : nhom === 'vs' ? muc(['2.', '3.'])
          : the([0, 1, 2, 3]) + muc(['1.', '4.', 'CHI PHÍ CHUNG']);
      t.innerHTML = '<div class="row sp"><select class="inp ky" id="tqKy">' + ds.map(function (x) { return '<option' + (x === o.ky ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select>' +
        '<button class="btn sm ghost" id="tqMoi">⟳ Cập nhật mới nhất</button></div>' +
        '<div class="meta">' + esc(o.capNhat) + '</div>' +
        (o.viec.length ? '<div class="note warn"><b>Việc cần xử lý</b>' + o.viec.map(function (v) { return '<div>' + esc(v) + '</div>'; }).join('') + '</div>' : '') +
        '<div class="seg" id="tqSeg"><button data-n="ln"' + (nhom === 'ln' ? ' class="on"' : '') + '>Lợi nhuận</button><button data-n="tien"' + (nhom === 'tien' ? ' class="on"' : '') + '>Tiền & công nợ</button><button data-n="vs"' + (nhom === 'vs' ? ' class="on"' : '') + '>Vendor & sale</button></div>' +
        than;
      document.querySelectorAll('#tqSeg button').forEach(function (b) { b.onclick = function () { S.tqNhom = b.getAttribute('data-n'); luu('vlta_tqn', S.tqNhom); hienTQ(o); }; });
      document.getElementById('tqKy').onchange = function () {
        var k = this.value;
        document.getElementById('tqMoi').disabled = this.disabled = true; taiTQ({ thang: k });
      };
      document.getElementById('tqMoi').onclick = function () {
        this.disabled = true; this.textContent = 'Đang cập nhật…'; taiTQ({ moi: 1 });
      };
    })();
  }

  // ---------- khởi động ----------
  S.tqNhom = doc('vlta_tqn') || 'ln';
  S.t = doc('vlta_t');
  if (S.t) {
    var toiCu = null, dsCu = null;
    try { toiCu = JSON.parse(doc('vlta_toi') || 'null'); dsCu = JSON.parse(doc('vlta_ds') || 'null'); } catch (e) { }
    if (toiCu) { S.toi = toiCu; S.data = dsCu || {}; vaoApp(); }   // hiện ngay bản đã lưu, tải bản mới phía sau
    else {
      $app.innerHTML = '<div class="lg"><div class="lg-top"><div class="mark">TA</div><h1>VIỆC LÀM TÂM AN</h1><p>Đang mở…</p></div></div>';
      api({ v: 'toi', t: S.t }).then(function (o) { if (o.loi) { dangXuat(true); return; } S.toi = o.toi; luuDs(); vaoApp(); }, function () { veDangNhap(); });
    }
  } else veDangNhap();
})();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { });</script>
