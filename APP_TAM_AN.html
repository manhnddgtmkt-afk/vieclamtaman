<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --navy:#1F3864; --on-navy:#FFFFFF; --bg:#E9EDF3; --card:#FFFFFF; --line:#C9D3E0; --soft:#F3F6FA; --tint:#DDEBF7;
  --fg:#16233A; --muted:#5E6B80; --good:#1E8A4C; --good-bg:#E3F4EA; --warn:#B86E00; --warn-bg:#FFF4D6; --bad:#C62828; --bad-bg:#FDE7E7;
  --blue:#2F6FD1; --cta:#1F3864; --font:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#16264A; --on-navy:#F2F5FA; --bg:#0F1522; --card:#182132; --line:#2C3A52; --soft:#1E2940; --tint:#1F3354;
  --fg:#E6ECF5; --muted:#9AA8BF; --good:#4CC27F; --good-bg:#16342A; --warn:#F0B14A; --warn-bg:#3A2E14; --bad:#FF7070; --bad-bg:#3D1C1F; --blue:#6EA2FF; --cta:#3B6FD0; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#16264A; --on-navy:#F2F5FA; --bg:#0F1522; --card:#182132; --line:#2C3A52; --soft:#1E2940; --tint:#1F3354;
  --fg:#E6ECF5; --muted:#9AA8BF; --good:#4CC27F; --good-bg:#16342A; --warn:#F0B14A; --warn-bg:#3A2E14; --bad:#FF7070; --bad-bg:#3D1C1F; --blue:#6EA2FF; --cta:#3B6FD0; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.app{max-width:480px;margin:0 auto;min-height:100vh}
/* đăng nhập */
.lg{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 85% 0%,#2B4F8C 0%,#1F3864 45%,#14264A 100%);color:#fff;overflow:hidden;position:relative}
.lg-art{position:absolute;right:-90px;top:-70px;width:340px;height:340px;opacity:.13;pointer-events:none}
.lg-top{padding:56px 24px 26px;position:relative}
.mark{width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,#fff,#DDE7F6);color:#1F3864;display:grid;place-items:center;font-weight:800;font-size:21px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.lg-top h1{margin:18px 0 2px;font-size:26px;font-weight:800;letter-spacing:.6px}
.lg-top p{margin:0;opacity:.78;font-size:14px}
.lg-card{margin-top:auto;background:var(--bg);color:var(--fg);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-width:480px;width:100%;align-self:center}
.lg-card h2{margin:0;font-size:19px}
.inp{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:19px;letter-spacing:.5px}
.inp:focus{border-color:var(--blue);outline:none}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px;background:var(--cta);color:#fff;width:100%}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:11px}
.lg-user{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;background:var(--tint);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:18px;flex:0 0 auto}
.dots{display:flex;gap:16px;justify-content:center;margin:6px 0 2px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--cta);border-color:var(--cta)}
.dots.sai{animation:lac .35s}
@keyframes lac{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;padding:0 10px}
.pad button{height:64px;width:64px;border-radius:50%;border:0;background:var(--card);box-shadow:0 0 0 1px var(--line) inset;font-size:25px;font-weight:600;justify-self:center}
.pad button:active{background:var(--tint)}
.pad .tx{background:none;box-shadow:none;font-size:14px;color:var(--blue);width:auto}
.msg{text-align:center;font-size:13.5px;min-height:19px;font-weight:600;color:var(--bad)}
.link{background:none;border:0;color:var(--blue);font-weight:600;padding:4px}
/* khung chính */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--on-navy);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.top h2{margin:0;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{opacity:.8;font-size:12px}
.meBtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--on-navy);color:var(--navy);font-weight:800;flex:0 0 auto}
.back{border:0;background:none;color:var(--on-navy);font-size:28px;padding:0 6px 0 0;line-height:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chip{border:1px solid rgba(255,255,255,.35);background:none;color:var(--on-navy);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--on-navy);color:var(--navy);border-color:var(--on-navy)}
.search{width:100%;margin-top:10px;padding:11px 14px;border-radius:12px;border:0;font-size:16px;background:rgba(255,255,255,.95);color:#16233A}
main{padding:14px 16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.fl{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.fl button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.fl button.on{background:var(--cta);color:#fff;border-color:var(--cta)}
.meta{font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;text-align:left;width:100%}
.it .nm{font-weight:700}
.it .sub{font-size:12.5px;color:var(--muted)}
.it .amt{margin-left:auto;text-align:right;font-weight:700;white-space:nowrap}
.it .amt small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn);margin-left:4px;vertical-align:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.big{font-size:26px;font-weight:800}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.g3 div{background:var(--soft);border-radius:10px;padding:8px}
.g3 span{display:block;font-size:11.5px;color:var(--muted)}
.g3 b{font-size:14px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts a{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:700;color:var(--fg);background:var(--soft)}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:42px;height:38px;font-size:18px}
.wk b{font-size:14px}
.slip{background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line);min-height:120px}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad);font-weight:600}
.note.ok{background:var(--good-bg);color:var(--good)}
.tcN .btn{margin-top:10px}.tcN .meta{margin-top:4px;color:inherit;opacity:.85}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right;word-break:break-word}
.sk{height:62px;border-radius:14px;background:linear-gradient(90deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:sk 1s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.sheet{position:fixed;inset:0;background:rgba(10,18,34,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
.sheet>div,.bmoi>div{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet>div{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow-x:hidden;overflow-y:auto;touch-action:pan-y}
.sheet h3{margin:0;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#16233A;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;text-align:center}

/* thanh dưới + các phần mới */
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;max-width:160px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0}
.nav button i{font-style:normal;font-size:20px;filter:grayscale(1);opacity:.7}
.nav button.on{color:var(--cta)}
.nav button.on i{filter:none;opacity:1}
.tag.moi{background:var(--tint);color:var(--blue)}
.lb{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:-6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2 .lb{display:block;margin:0 0 4px}
.sheet .inp{font-size:16px;padding:12px 14px}
.btn.xn{background:var(--warn);color:#fff}
.btn.bo{background:#C62828;color:#fff}
.acts .btn{flex:1}
.ul{display:flex;flex-direction:column;margin-top:8px}
.ur{display:grid;grid-template-columns:52px 1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.ur .d{color:var(--muted)}
.ur .l.u{color:var(--warn);font-weight:600}
.ur .l.t{color:var(--good);font-weight:600}
.ur .g{grid-column:2/4;font-size:12.5px;color:var(--muted)}
.hero .big{font-size:30px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tc{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tc span{font-size:12px;color:var(--muted);font-weight:600}
.tc b{font-size:18px}
.tc small{font-size:11.5px;color:var(--muted)}
.tc.good{border-top-color:var(--good)} .tc.bad{border-top-color:var(--bad)} .tc.bad b{color:var(--bad)} .tc.orange{border-top-color:#D9730D} .tc.gray{border-top-color:#8A93A1}
details.mc summary{list-style:none;cursor:pointer}
details.mc summary::-webkit-details-marker{display:none}
details.mc summary b::after{content:" ▾";color:var(--muted)}
details.mc[open] summary b::after{content:" ▴"}
.mb{border-top:1px solid var(--line);padding:9px 0}
.mb .mt{font-weight:700;margin-bottom:4px}
.mb.tong{background:var(--tint);margin:0 -14px;padding:9px 14px}
.mb .kv{font-size:13px;gap:3px 12px}
.mr{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.mr.nt{color:var(--muted);font-size:12.5px;display:block}
.am{color:var(--bad)}
.it.so{cursor:default}
.kv.so{grid-template-columns:minmax(0,1fr) auto}
.kv b.num{white-space:nowrap}
#them{white-space:nowrap;flex:0 0 auto}
.note:not(.warn):not(.bad):not(.ok){background:var(--soft);color:var(--muted)}

html,body{overflow-x:hidden}
main,.card{min-width:0}
.card,.mb,.dg{overflow-wrap:anywhere}
.mr1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:600}
.mr1 b{white-space:nowrap}
.dg{font-size:12.5px;color:var(--muted);margin-top:3px}
.inp.ky{width:auto;font-size:15px;padding:9px 12px;font-weight:700;background:var(--warn-bg)}
pre.log{white-space:pre-wrap;font-size:12px;background:var(--soft);border-radius:10px;padding:10px;max-height:220px;overflow:auto;margin:0}

/* tiến trình */
.tt{position:fixed;left:0;right:0;top:0;z-index:80;pointer-events:none;opacity:0;transition:opacity .2s}
.tt.on{opacity:1}
.ttbar{height:3px;background:transparent}
.ttbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4CC27F,#6EA2FF);transition:width .12s linear;box-shadow:0 0 8px rgba(110,162,255,.7)}
.ttpill{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(22,35,58,.94);color:#fff;border-radius:999px;padding:6px 14px 6px 6px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.3);white-space:nowrap}
.ttpill svg{width:34px;height:34px;transform:rotate(-90deg)}
.ttpill circle{fill:none;stroke-width:4}
.ttpill .n{stroke:rgba(255,255,255,.18)}
.ttpill .v{stroke:#4CC27F;stroke-dasharray:94.2;stroke-dashoffset:94.2;stroke-linecap:round;transition:stroke-dashoffset .12s linear}
.ttpill span{position:absolute;left:6px;width:34px;text-align:center;font-size:9.5px;font-weight:700}
.ttpill b{font-weight:600}
/* chọn tuần */
.tuans{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tch{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 11px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:96px}
.tch b{font-size:13.5px}
.tch small{font-size:11.5px;color:var(--muted)}
.tch.tra{border-color:var(--good)}
.tch.on{background:var(--cta);border-color:var(--cta);color:#fff}
.tch.on small{color:rgba(255,255,255,.8)}

/* việc hôm nay */
.vhc{display:flex;flex-direction:column;gap:6px}
.vh{display:flex;align-items:center;gap:6px;border:0;background:var(--soft);border-radius:10px;padding:10px 12px;text-align:left;font-size:14px;width:100%}
.vh i{margin-left:auto;font-style:normal;color:var(--muted);font-size:18px}
.vh.nb{background:var(--warn-bg);color:var(--warn);font-weight:600}
/* lịch bảng công */
.lich2{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.lh,.lw{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.lh span{text-align:center;font-size:11.5px;color:var(--muted);font-weight:700}
.ld{border:1.5px solid transparent;border-radius:9px;padding:5px 0;display:flex;flex-direction:column;align-items:center;background:var(--soft);min-height:46px}
.ld b{font-size:13px}.ld small{font-size:11px;color:var(--muted)}
.ld.ngay{background:#DCEBF9;color:#16233A}.ld.dem{background:#E6DCF2;color:#16233A}.ld.ngay small,.ld.dem small{color:#3A4A66}
.ld.loi{border-color:#D9730D}
.ld.ngoai{opacity:.3;background:none}
.lgd{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
.lgd i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.lgd i.ngay{background:#DCEBF9}.lgd i.dem{background:#E6DCF2}.lgd i.nghi{background:var(--soft);border:1px solid var(--line)}.lgd i.loi{border:2px solid #D9730D}
.lgd i.in{background:var(--good)}.lgd i.out{background:var(--bad)}
textarea.inp{font-size:15px;resize:vertical}
/* bàn phím tiền */
.npb{display:flex;flex-direction:column;gap:8px}
.nph{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
.nph span{font-size:24px;font-weight:800}.nph span.rong{color:var(--muted)}
.nph .link:disabled{opacity:.35}
.np{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.np button{height:50px;border-radius:12px;border:0;background:var(--card);box-shadow:0 0 0 1px var(--line) inset;font-size:21px;font-weight:600}
.np button:active{background:var(--tint)}
/* dòng tiền 6 tuần */
.dt{border-top:1px solid var(--line);padding:9px 0}
.dth{display:flex;justify-content:space-between;font-size:14px}
.bars{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.bars i{display:block;height:7px;border-radius:4px;min-width:2px}
.bars i.in{background:var(--good)}.bars i.out{background:var(--bad)}
/* tài khoản */
.avw{position:relative;cursor:pointer;flex:0 0 auto}
.avw span{position:absolute;right:-4px;bottom:-4px;font-size:15px;background:var(--card);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.av.img{object-fit:cover;padding:0}
.meBtn{overflow:hidden;padding:0}
.meBtn img{width:100%;height:100%;object-fit:cover;display:block}
.sw{display:flex;gap:8px;align-items:center;font-size:14.5px}
.sw input{width:20px;height:20px}
/* ===== GIAO DIỆN MỚI 20/10 (anh duyệt bản mẫu): 1 điểm nhìn chính, chữ 3 mức, 1 màu nhấn cho thứ bấm được, màu ý nghĩa chỉ khi có vấn đề ===== */
:root{
  --bg:#F4F6F9; --card:#FFFFFF; --line:#E6EAF0; --soft:#EEF1F5; --tint:#E8EEF8; --edge:#D5DCE6;
  --fg:#0F1B2D; --fg2:#3A4657; --muted:#5B6676; --faint:#8A94A3;
  --blue:#1F4FA3; --cta:#1F4FA3; --navy:#F4F6F9; --on-navy:#0F1B2D;
  --good:#17804A; --good-bg:#E7F4EC; --warn:#8A5300; --warn-bg:#FFF3DC; --bad:#C42B2B; --bad-bg:#FDECEC;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131B; --card:#171E29; --line:#263040; --soft:#1F2835; --tint:#1C2A40; --edge:#33405A;
  --fg:#E8EDF4; --fg2:#C3CCD8; --muted:#9AA6B6; --faint:#76829A;
  --blue:#86AAF0; --cta:#3E6FC7; --navy:#0E131B; --on-navy:#E8EDF4;
  --good:#5BC98A; --good-bg:#16342A; --warn:#F0B14A; --warn-bg:#3A2E14; --bad:#FF7A7A; --bad-bg:#3D1C1F}}
:root[data-theme="dark"]{
  --bg:#0E131B; --card:#171E29; --line:#263040; --soft:#1F2835; --tint:#1C2A40; --edge:#33405A;
  --fg:#E8EDF4; --fg2:#C3CCD8; --muted:#9AA6B6; --faint:#76829A;
  --blue:#86AAF0; --cta:#3E6FC7; --navy:#0E131B; --on-navy:#E8EDF4;
  --good:#5BC98A; --good-bg:#16342A; --warn:#F0B14A; --warn-bg:#3A2E14; --bad:#FF7A7A; --bad-bg:#3D1C1F}
body{font-size:15px;line-height:1.5}
/* đầu trang: chữ lớn trên nền sáng, không dải màu */
.top{background:var(--bg);color:var(--fg);padding:calc(14px + env(safe-area-inset-top,0px)) 20px 8px}
.top h2{font-size:28px;font-weight:700;letter-spacing:-.01em}
.top small{opacity:1;font-size:13px;color:var(--muted)}
.top .back{color:var(--blue);font-size:32px;padding:0 8px 0 0}

      { i: '🎁', t: 'Thưởng 7 ngày', m: 'Người bạn tuyển đã qua ngày dự kiến đủ 7 ngày làm việc hiện ở mục Thưởng 7 ngày, kèm trạng thái Trend đã kiểm tra bảng công hay chưa, để báo lại người lao động.', v: 'sale' }] },
    { so: 150, ds: [{ i: '📝', t: 'Đọc lưu ý quay trước khi tải video', m: 'Mỗi video đã dựng có kèm lưu ý của bên dựng: lần quay này bị lỗi gì và lần sau cần làm gì. Muốn tải video về phải xem hết video, đọc từng lưu ý và trả lời đúng một câu hỏi. Đọc một lần là xong, bấm Tải lại sau đó không phải đọc nữa.', c: [['Tải video có lưu ý', 'Bấm [[Xem để tải về]] → xem hết video → bấm [[Đọc lưu ý để tải video]] → đọc từng lưu ý → trả lời câu hỏi → bấm [[Lưu vào máy]].'], ['Trả lời sai', 'App hiện lại lưu ý đó để đọc kỹ, rồi hỏi một câu khác.']], v: 'sale,ketoan' },
      { i: '⚠️', t: 'Ô Lỗi cần tránh trong phần Kịch bản', m: 'Đầu phần Kịch bản có ô Lỗi cần tránh: những lỗi quan trọng hoặc đã mắc lại trong 3 tuần gần đây, kèm việc cần làm, để xem lại trước khi đi quay. Ai mắc lại lỗi đã được nhắc thì điện thoại báo ngay.' },
      { i: '👁️', t: 'Biết sale đọc lưu ý thế nào', m: 'Mỗi lần sale đọc xong lưu ý của một video, điện thoại của chủ báo sale đó đã xem bao nhiêu phần trăm video, đọc trong bao lâu và trả lời sai mấy lần. Ô Lỗi cần tránh của từng sale cũng ghi lần đọc gần nhất.', v: 'chu' }] },
    { so: 149, ds: [{ i: '🪪', t: 'Số ảnh chờ CCCD TẠM tự cập nhật', m: 'Khi đang mở mục CCCD, số ảnh chờ trong CCCD TẠM tự cập nhật khoảng 1 phút một lần và ngay khi quay lại app, không cần thoát ra vào lại. Sale vừa gửi ảnh lên là nút Xử lý ảnh chờ trong CCCD TẠM hiện ra.' }] },
    { so: 148, ds: [{ i: '🕘', t: 'Video sửa lại ghi đúng giờ sửa', m: 'Video được dựng lại (bản sửa) nay ghi Sửa lúc kèm giờ sửa mới nhất thay vì giờ lên lần đầu, và nằm trên cùng danh sách, nên biết ngay đâu là bản mới.', v: 'chu' }] },
    { so: 147, ds: [{ i: '🗑️', t: 'Xoá video trong mục Video đã dựng', m: 'Video không dùng thì xoá được ngay, video vào Thùng rác của Drive, trong 30 ngày vẫn lấy lại được.', c: [['Xoá từ danh sách', 'Giữ ngón tay lên thẻ video → [[Xoá video]].'], ['Xoá khi đang xem', 'Mở video → bấm chữ Xoá màu đỏ cạnh nút Duyệt video này.'], ['Xoá nhầm', 'Bấm Hoàn tác ở cuối màn hình trong 10 giây.']], v: 'chu' }] },
    { so: 146, ds: [{ i: '🎬', t: 'Kịch bản riêng cho từng người', m: 'Mỗi người chỉ thấy bản kịch bản của chính mình. Báo đã quay hay đã đăng cũng chỉ đổi trạng thái bản của mình, không ảnh hưởng người kia.', c: [['Báo trạng thái', 'Mở bài → bấm [[Đã quay xong]]. Đăng lên mạng rồi thì mở lại bài → bấm [[Đã đăng]], không phải dán link. Bấm nhầm thì chọn Hoàn tác ở cuối màn hình.']] },
      { i: '👀', t: 'Xem bản của từng người', m: 'Mở một bài sẽ có nút Bản Hòa và Bản Long để xem lời thoại và trạng thái của từng người. Phần chấm điểm đã bỏ.', v: 'chu' }] },
    { so: 145, ds: [{ i: '🎬', t: 'Mục Content: kịch bản quay video mỗi ngày', m: 'Nút Video ở thanh dưới đổi thành Content, gồm 2 phần: Kịch bản và Video đã dựng. Mỗi ngày có kịch bản quay mới, bài nào chưa quay vẫn nằm lại cho tới khi quay xong. Xem video, tải video và gửi clip quay vẫn ở phần Video đã dựng như cũ.', c: [['Xem kịch bản', 'Bấm [[Content]] → phần [[Kịch bản]] → chạm vào một bài để xem bình luận ghim, lời thoại, đạo cụ và chú thích khi đăng. Bấm [[Chép]] để chép chú thích dán lên TikTok.'], ['Bài có dải vàng', 'Đó là thông tin chưa chắc chắn, không nói câu đó trong video.']] }] },
    { so: 143, ds: [{ i: '✅', t: 'Duyệt video trước khi gửi sale', m: 'Chủ: mục Video chia tab Cá nhân và từng sale. Video mới hoặc bản sửa lại nằm ở tab của sale, điện thoại báo Video chờ duyệt. Xem trước → bấm Duyệt (hoặc Duyệt tất cả). Duyệt xong video chuyển sang máy sale và máy sale báo có video mới. Sale chỉ thấy video đã được duyệt.' }] },
    { so: 142, ds: [{ i: '🔔', t: 'Thông báo của app', m: 'App cần bật thông báo mới dùng được: bấm Bật thông báo → Cho phép. Từ đó có video mới của bạn, điện thoại hiện thông báo như tin nhắn, bấm vào là mở thẳng mục Video. Kiểm tra hoặc gửi thử ở Tài khoản → Thông báo.' }] },
    { so: 141, ds: [{ i: '🔔', t: 'Máy báo khi có video mới', m: 'Video của bạn dựng xong, điện thoại hiện thông báo như tin nhắn, bấm vào là mở thẳng mục Video. iPhone cần mở app từ biểu tượng trên Màn hình chính.' }] },
    { so: 140, ds: [{ i: '🛠', t: 'Sửa lỗi hiển thị', m: 'Tìm trong kho CCCD: các ô ảnh luôn cao bằng nhau, tên và nút kính lúp nằm ngay dưới ảnh, không còn ô bị lệch hay khoảng trắng. Hộp sửa giờ của BEST: ô Giờ vào, Giờ ra nằm gọn trong màn hình, kéo ngón tay không còn làm cả hộp trôi sang ngang.', v: '' }] },
    { so: 139, ds: [{ i: '🎬', t: 'Video: ai nấy thấy video của mình', m: 'Mục Video giờ chỉ hiện video dựng từ clip của chính bạn. Có video mới dựng xong, app báo ngay ở cuối màn hình, bấm Xem là tới. Chấm đỏ trên nút Video tự cập nhật khoảng 3 phút một lần, kể cả khi bạn đang ở mục khác.' }] },
    { so: 138, ds: [{ i: '📤', t: 'File gửi HOJEONG: báo đã gửi bằng cách khác', m: 'Nếu anh gửi file cho HOJEONG bằng Zalo trên máy tính thì app không tự biết. Mở thẻ File gửi HOJEONG, bấm Đã gửi bằng cách khác để app ghi nhận. Qua mùng 5, file đã gửi thì thẻ tự ẩn; chưa gửi thì thẻ thu lại còn một dòng đỏ để nhắc.', c: [['Cách báo đã gửi', 'Tab [[Lao động]] → HOJEONG → chạm thẻ File gửi HOJEONG → [[Đã gửi bằng cách khác]] → [[Đã gửi]].']], v: 'chu' }] },
    { so: 137, ds: [{ i: '🔄', t: 'Vuốt xuống để lấy số mới', m: 'Ở đầu trang của bất kỳ mục nào, đặt ngón tay kéo màn hình xuống rồi thả ra: app lấy ngay số liệu mới nhất của mục đang xem và báo Đã cập nhật lúc mấy giờ. Đang gửi hay tải video dở không bị ảnh hưởng.' }] },
    { so: 136, ds: [{ i: '⬆️', t: 'Gửi nhiều clip một lần ổn định hơn', m: 'Sửa lỗi chọn nhiều clip một lúc nhưng app không nhận. Nếu iPhone vẫn không đưa clip vào app, app sẽ báo rõ để chọn lại ít clip hơn.' }] },
    { so: 134, ds: [{ i: '⬆️', t: 'Gửi clip quay: thấy rõ tiến độ', m: 'Chọn clip xong, hộp tự đóng và mục Video hiện ngay thẻ Đang gửi với phần trăm từng clip. Gửi xong thẻ báo ✓ Đã gửi xong, clip nào lỗi có nút Gửi lại.', c: [['Đang gửi có sang tab khác được không', 'Được. Khi đang gửi, nút [[Video]] ở thanh dưới hiện số phần trăm màu xanh để biết việc gửi vẫn đang chạy. Chỉ khi thoát app hoặc khoá màn hình thì việc gửi tạm dừng, mở lại app sẽ tự gửi tiếp.']] }] },
    { so: 133, ds: [{ i: '⬆️', t: 'Gửi clip quay lên kho dựng video', m: 'Quay xong không cần mở Drive: gửi clip ngay trong app, clip tự vào đúng mục của người gửi trong kho dựng video (ví dụ VLOG / HOA / 7.11) để máy dựng lấy làm.', c: [['Cách gửi', 'Vào [[Video]] → bấm [[Gửi clip quay]] → chọn loại (VLOG, TALK) → [[Chọn clip trong máy]] → chọn một hoặc nhiều clip. Giữ app mở tới khi các clip hiện ✓ Đã gửi.'], ['Giữ chất lượng gốc', 'Nếu iPhone hiện Đang nén video, bấm *Tùy chọn* ở đầu khung chọn ảnh rồi chọn *Hiện tại*. Nên dùng wifi vì clip nặng.'], ['Mất sóng giữa chừng', 'App tự gửi tiếp phần còn thiếu. Lỡ thoát app thì mở lại, chọn đúng clip đó, app gửi tiếp chỗ đang dở.']] }] },
    { so: 132, ds: [{ i: '🧾', t: 'Ứng / trả không phải chọn người trả nữa', m: 'Tiền ứng và trả lương luôn lấy từ quỹ công ty nên khi ghi ứng hoặc trả lương trên app không còn ô chọn người trả. Trên Google Sheet, cột Người trả ở sổ ứng trả đã được ẩn, dữ liệu cũ vẫn giữ nguyên.' },
      { i: '⚠️', t: 'Dòng ứng / trả bị lỗi hiện rõ', m: 'Vào Ứng / trả: dòng nào bị lỗi (ví dụ tên chưa có trong bảng công, thiếu ngày hoặc số tiền) nằm trên cùng, ghi rõ tên người, số tiền và lỗi gì. Ở Tổng quan, chạm vào dòng ứng/trả trong Việc cần xử lý là mở thẳng mục này.', v: 'chu' }] },
    { so: 130, ds: [{ i: '🔔', t: 'Thông báo thay đổi bảng công gọn mắt hơn', m: 'Các thay đổi được gom theo ngày sửa, mỗi người một khối: tên người ở dòng đầu, bên phải ghi ai sửa và lúc mấy giờ. Bên dưới là nhãn màu cho biết loại thay đổi, rồi đến câu nói rõ đã đổi gì, số tiền in đậm. Lý do nằm ở dòng chữ xám phía dưới.', c: [['Đánh dấu đã xem', 'Mỗi người có một nút [[Đã xem]] ở cuối khối, bấm là đánh dấu hết các thay đổi của người đó trong ngày.'], ['Bớt báo không cần thiết', 'Sửa giờ mà giờ không đổi (chỉ khác cách ghi số, ví dụ 7:58 và 07:58) thì không báo nữa.']], v: 'chu' }] },
    { so: 128, ds: [{ i: '🎬', t: 'Mục Video ghi rõ ai đã tải', m: 'Dòng đã tải ghi đúng tên người tải (ví dụ: Long đã tải 17:45), người tự tải thấy chữ Bạn. Bỏ dòng chú thích dài ở đầu mục, ngày tự xoá đã ghi riêng trên từng video.' }] },
    { so: 127, ds: [{ i: '🎬', t: 'Xem trước video gọn hơn', m: 'Chạm vào ảnh của video là app tải video và phát ngay khi tải được đoạn đầu (khoảng 5–10 giây). Chỉ còn một bộ nút điều khiển của điện thoại, đang phát thì tự ẩn.', c: [['Lưu sau khi xem', 'Xem xong, video đã nằm sẵn trong máy: bấm [[Lưu vào máy]] ở dưới là lưu luôn, không phải tải lại.'], ['Không ưng thì đóng', 'Bấm [[Đóng]] ở góc trên, app dừng tải ngay, chỉ tốn phần đã xem. Nên dùng wifi vì video khá nặng.']] }] },
    { so: 126, ds: [{ i: '🎬', t: 'Xem trước video to hơn', m: 'Chạm vào ảnh của video là video mở to kín màn hình. Đang phát thì các nút điều khiển tự ẩn sau vài giây, chạm vào video để hiện lại.', c: [['Đóng hoặc tải', 'Bấm [[Đóng]] ở góc trên để quay lại danh sách, hoặc bấm [[Tải về]] ở dưới để tải video gốc.']] }] },
    { so: 125, ds: [{ i: '🔔', t: 'Thông báo thay đổi bảng công dễ đọc hơn', m: 'Mỗi thay đổi trên bảng công giờ được viết thành một câu đủ ý: ai bị sửa, sửa thành gì, người sửa là ai và sửa lúc nào. Chữ dài tự xuống dòng, không bị cắt.',
      c: [['Xem chi tiết', 'Chạm vào dòng để mở hồ sơ người đó. Dòng vẫn còn đó, chỉ mất khi bấm [[Đã xem]].'],
        ['Xem lại thay đổi đã xem', 'Bấm [[Xem lại … thay đổi đã xem trong 7 ngày]] ở cuối thẻ.'],
        ['Bớt báo không cần thiết', 'Sale ghi người tuyển lần đầu thì không báo nữa. Chỉ báo khi người tuyển bị đổi từ sale này sang sale khác, vì việc đó làm thay đổi tiền thưởng.']], v: 'chu' }] },
    { so: 124, ds: [{ i: '🎬', t: 'Mục Video: xem trước và tải về ổn định hơn', m: 'Xem trước dùng trình phát của Google Drive nên phát được ngay, không phải chờ tải. Tải về đi qua máy chủ của công ty, không còn bị Google chặn khi nhiều người cùng tải.' }] },
    { so: 123, ds: [{ i: '⚡', t: 'Tải video nhanh hơn', m: 'Mục Video tải nhiều phần của video cùng lúc nên nhanh hơn trước. Mất sóng giữa chừng thì app tự tải tiếp phần còn thiếu, không phải tải lại từ đầu.' }] },
    { so: 121, ds: [{ i: '🎬', t: 'Mục Video ở thanh dưới', m: 'Video truyền thông đã dựng xong hiện ở mục Video. Có thể xem trước và lưu video về điện thoại để đăng hoặc gửi đi.',
      c: [['Xem trước', 'Chạm vào ảnh của video để xem.'],
        ['Lưu video về điện thoại', 'Bấm [[Tải về]] → tải xong bấm [[Lưu vào máy]] → chọn *Lưu video*. Video vào thư viện Ảnh.'],
        ['Lưu ý', 'Video đã có người tải thì cả nhóm đều thấy ai đã tải; muốn tải lần nữa bấm [[Tải lại]]. Video đã tải tự xoá sau 3 ngày, chưa ai tải tự xoá sau 7 ngày.']] }] },
    { so: 120, ds: [{ i: '📷', t: 'Lưu ảnh CCCD về điện thoại', m: 'Giờ có thể lưu ảnh CCCD trong kho vào thư viện Ảnh của điện thoại, hoặc gửi thẳng qua Zalo. Mỗi người là 1 ảnh có đủ 2 mặt.',
      c: [['Lưu 1 người', 'Mở ảnh người đó → bấm [[Lưu ảnh về máy]] → chọn *Lưu hình ảnh*.'],
        ['Lưu nhiều người cùng lúc', 'Trong kho, chọn những người cần lưu (tối đa 20 người một lần) → bấm [[Ảnh]] ở thanh dưới → bấm [[Lưu / Gửi]] → chọn *Lưu hình ảnh*, hoặc chọn *Zalo* để gửi.']] }] },
    { so: 119, ds: [['Thẻ HOJEONG nhỏ lại 3 mm mỗi chiều: 8,2 × 5,7 cm (trước 8,5 × 6 cm) để nhét vào bao thẻ dễ hơn. Ảnh, chữ và mã thẻ thu nhỏ theo, bố cục giữ nguyên. Khổ A4 vẫn 8 thẻ một tờ, khổ A5 vẫn 4 thẻ một tờ.', '']] },
    { so: 118, ds: [['CCCD – ảnh lưu kho: ảnh có nền thẻ bị ám màu (xanh lè, tím, vàng do đèn hoặc camera) được tự kéo về gần màu thẻ thật, chữ đen và giấy trắng giữ nguyên.', '']] },
    { so: 117, ds: [['CCCD – ảnh lưu vào kho: là ảnh màu, app tự cân bằng trắng theo từng ảnh (chụp dưới đèn vàng, đèn xanh hay trong bóng râm đều về màu tự nhiên) và không còn tăng tương phản gắt làm cháy mặt người. Ảnh bị mất hẳn một màu thì app tô lại màu theo thẻ mẫu cùng loại.', ''], ['In CCCD và Gửi PDF ra quán in: app tự tạo bản đen trắng rõ nét cho máy in laser – chữ và số đậm, hoa văn nền nhạt, mặt người được chỉnh sáng riêng để không lóa, không bết đen. Ảnh cũ trong kho khi in cũng được xử lý như vậy (ảnh trong kho giữ nguyên).', ''], ['Khối "Chỉnh ảnh in": mặc định là tự chỉnh theo từng ảnh; 3 thanh kéo dùng để chỉnh thêm cho bản in khi cần (50 = tự động). Thẻ HOJEONG lấy ảnh chân dung từ ảnh màu đã cân bằng trắng.', '']] },
    { so: 116, ds: [['Phiếu đối chiếu vendor: khoản của Quyền ở ATUM (tháng 9, tháng 10) nay có đủ từng công nhân, giờ làm, tiền ăn và đơn giá, lấy từ file lưu trữ ATUM. Dòng "Người cung ứng khác" là khoản gộp nên không xuất phiếu.', 'chu']] },
    { so: 115, ds: [['Tổng quan → Phải trả vendor: chạm vào một khoản (ví dụ Đức · Tháng 10) để xuất phiếu đối chiếu gửi vendor. Phiếu có dự kiến thanh toán, đơn giá vendor nhận, từng công nhân (ngày, giờ, tiền công, lương công nhân, vendor nhận) và lịch đi làm từng ngày. Bấm Chép ảnh hoặc Lưu / Gửi để gửi qua Zalo.', 'chu']] },
    { so: 114, ds: [['Tổng quan → Phải trả vendor: mỗi người cung ứng gom thành một dòng tổng tiền, ghi số khoản và hạn trả gần nhất. Chạm vào dòng để xem từng khoản theo tháng và hạn trả của khoản đó. Khoản của kỳ đang chạy ghi "Tạm tính". Danh sách xếp theo hạn trả gần nhất lên đầu.', 'chu']] },
    { so: 113, ds: [['Nguồn tuyển bắt buộc: người chưa có nguồn tuyển trên bảng công thì khi xuất phiếu lương, ghi ứng / trả lương, sửa bảng công hoặc xác nhận tăng cường, app hiện hộp chọn nguồn tuyển ngay tại chỗ. Chọn xong là làm tiếp.', ''], ['Trên Google Sheet: phải chọn Nguồn tuyển (bảng công, cột AY) hoặc SALE (DANH_SACH, cột I) trước, rồi mới gõ được họ tên.', ''], ['Thêm người mới trên app: bắt buộc chọn sale tuyển.', '']] },
    { so: 112, ds: [['CCCD: app bắt thêm lỗi khung cắt sai – khung lấy cả nền nhà, chữ trên thẻ bị xoay dọc. Ảnh như vậy hiện dòng vàng "Ảnh cắt chưa chuẩn" và không tự lưu vào kho; chạm ảnh → Chỉnh khung cắt để kéo lại 4 góc.', ''], ['Ảnh chờ trong CCCD TẠM: lấy cả ảnh nằm trong thư mục con (vd thư mục "cc"), trước đây bị bỏ sót.', '']] },
    { so: 111, ds: [['CCCD: ảnh tự cắt bám đúng mép thẻ hơn – thẻ chụp trên nền sáng (sàn đá, giấy trắng) không còn bị nắn xiên.', ''], ['Chuẩn chung cho mọi ảnh vào kho: dòng chữ trên thẻ nghiêng quá 1° thì hiện dòng vàng "Ảnh cắt chưa chuẩn (ảnh nghiêng …)" và không tự lưu kho. Chạm ảnh → Chỉnh khung cắt kéo 4 góc đúng mép thẻ là hết báo.', '']] },
    { so: 110, ds: [['CCCD → Tìm ảnh trong kho: mở ra không còn điền sẵn năm sinh, giới tính của lần tìm trước – gõ tên là tìm ngay.', '']] },
    { so: 109, ds: [['CCCD → Tìm ảnh trong kho: ô mới trên cùng "Gõ tên, năm sinh hoặc số CCCD". Gõ là ra ngay (không chờ máy chủ), không cần gõ dấu, gõ đầu chữ cũng được: "huong 1995", "ng t hoa", "0241950". Mỗi ảnh hiện họ tên + ngày sinh. Cả kho đã được soát, đủ họ tên có dấu và ngày sinh.', ''], ['Ảnh lưu mới từ app tự thêm họ tên, ngày sinh vào danh bạ và có ảnh nhỏ ngay; máy đọc được tên đầy đủ hơn thì tự cập nhật (tên đã sửa tay thì giữ nguyên).', ''], ['Xem to một CCCD có nút "Sửa tên / ngày sinh": thấy tên sai thì sửa ngay, danh bạ của mọi máy cập nhật theo.', '']] },
    { so: 108, ds: [['CCCD: app tự chấm ảnh vừa cắt. Ảnh cắt chưa chuẩn (không thấy khung thẻ, khung mờ, thẻ quá nhỏ, khung méo) hiện dòng vàng "Ảnh cắt chưa chuẩn" và KHÔNG tự lưu vào kho – kể cả khi bấm In. Chạm ảnh → Chỉnh khung cắt kéo 4 góc sát thẻ là hết báo; thấy ảnh đã thẳng, sát thẻ thì bấm "Ảnh ổn".', ''], ['Nút xuất file CCCD gửi Đại Thành: ảnh trong CCCD TẠM cắt chưa chuẩn thì không tự ghép vào kho, ghi vào bảng người thiếu để xử lý trong app.', 'chu']] },
    { so: 106, ds: [['Tổng quan: dòng vàng chỉ hiện khi có công ty đang làm chưa có số kỳ mới, ghi rõ tên công ty đó (trước đây báo nhầm vì đếm cả công ty đã dừng).', 'chu']] },
    { so: 105, ds: [['In CCCD và Thẻ HOJEONG: chọn ảnh chụp màn hình VNeID (cả 2 mặt trong 1 ảnh) thì app tự cắt từng mặt, tự ghép thành 1 người, giữ nguyên màu ảnh.', '']] },
    { so: 104, ds: [['Thẻ HOJEONG: tích người là ô mã thẻ tự điền mã đề xuất (ưu tiên mã cũ in thẻ mà người đó không đi làm, rồi đến số tiếp theo). Sửa được nếu muốn.', ''],
      ['App tự biết mã đã dùng ở thẻ in bằng app, file Form thẻ Excel trên Drive, bảng công và vân tay. Gõ trùng mã người khác thì app báo ngay dưới ô mã.', '']] },
    { so: 103, ds: [['BEST – bảng công: ngày về sớm (công lẻ, chưa tính lương) có nút "Trả công lẻ" như HOJEONG. BEST đồng ý trả thì bấm nút, ngày đó được tính tiền theo giờ (đơn giá ở bảng cơ chế), phiếu tuần hiện đúng ngày và số tiền.', ''],
      ['Ngày đã trả công lẻ có nút "Bỏ trả công lẻ" nếu bấm nhầm. Sửa giờ vào/ra ngày đó thì xác nhận cũ tự bỏ, cần thì xác nhận lại.', ''],
      ['Sale trả / bỏ trả công lẻ BEST thì chủ nhận thông báo như HOJEONG.', 'chu']] },
    { so: 102, ds: [['Thẻ HOJEONG: chọn ảnh chân dung mà app tưởng là mặt sau CCCD thì không bị chặn nữa – bấm "Vẫn dùng làm ảnh thẻ".', '']] },
    { so: 99, ds: [['Tiền & công nợ → Lịch thu tiền: hạn thu tính đúng theo hợp đồng từng công ty và ngày xuất hóa đơn (HOJEONG ngày 20 tháng sau tháng xuất hóa đơn, BEST 30 ngày làm việc, CHAOFENG 15 ngày, ATUM 60 ngày). Kỳ chưa có hóa đơn ghi "Chưa có HĐ", ngày bên trái là hạn ước theo lịch xuất hóa đơn thường lệ.', 'chu'],
      ['Giá trị hóa đơn HOJEONG tính VAT 0% đúng như hóa đơn.', 'chu']] },
    { so: 98, ds: [['Tổng quan → Vendor & sale: khối mới "Trả lương ngày 05/xx" ghi tổng phải trả và từng nhân viên (lương tháng trước + nợ cũ nếu còn). Khối hiện từ mùng 1 đến mùng 5; ghi "Lương sale" trong sổ thu chi đủ số thì tự ẩn; quá mùng 5 chưa trả đủ thì hiện đỏ "quá hạn".', 'chu'],
      ['Thẻ nhân viên kinh doanh ghi rõ kỳ: "Lương T11 tạm tính", "giờ kỳ T11".', 'chu'],
      ['Thu nhập của tôi: từ mùng 1 đến mùng 5 có dòng "Nhận ngày 05/xx" – số lương tháng trước sẽ nhận.', '']] },
    { so: 97, ds: [['Thẻ "File gửi HOJEONG": bỏ ô "Số hóa đơn thật" – xuất hóa đơn xong không phải gửi gì thêm cho HOJEONG.', 'chu']] },
    { so: 96, ds: [['Thẻ "File gửi HOJEONG": bấm "Gửi cho HOJEONG qua Zalo" một lần là mở Zalo ngay (file đã tải sẵn); có "Xem file" để mở xem trước khi gửi. Gửi xong thẻ tự thu gọn còn một dòng "Đã gửi HOJEONG lúc…".', 'chu'],
      ['Điền số hóa đơn thật sau khi phát hành trên MISA, máy xuất bản chính thức có số hóa đơn ở mọi chứng từ. Bản đã gửi HOJEONG không bao giờ bị tự bỏ.', 'chu'],
      ['Bảng công thay đổi sau khi HOJEONG đã gửi danh sách linh kiện thì thẻ và email báo rõ; email chỉ gửi khi kết quả thay đổi, không gửi dồn dập.', 'chu'],
      ['Sale: file làm xong thì thẻ thu còn một dòng; đang làm thì không có nút bấm, tự cập nhật khi xong. Thả file vào thư mục DANH_SACH_LINH_KIEN ngày nào máy cũng nhận.', '']] },
    { so: 95, ds: [['Tổng quan → ô chọn kỳ hiện kỳ mới ngay khi kỳ công bắt đầu (vd kỳ tháng 11 của HOJEONG từ 26/10), không phải chờ sang tháng theo lịch.', 'chu'],
      ['Kỳ mới chưa đủ các công ty thì có dòng vàng nhỏ ghi rõ mới có số của công ty nào, số là tạm tính.', 'chu']] },
    { so: 94, ds: [['Tab Lao động → HOJEONG có thẻ "File gửi HOJEONG": khi HOJEONG gửi danh sách linh kiện qua Zalo, bấm "Gửi danh sách linh kiện", chọn file đó; máy tự làm bộ file gửi HOJEONG trong khoảng 2 phút.', ''],
      ['Máy tự kiểm 10 điểm (khớp từng dòng linh kiện, tổng tiền, ngày, bằng chữ, không ô lỗi…). Đạt thì bấm "Gửi file cho HOJEONG" rồi chọn Zalo; chưa đạt thì không gửi được và ghi rõ sai ở đâu.', 'chu'],
      ['Có email báo kết quả mỗi lần máy làm xong file.', 'chu']] },
    { so: 93, ds: [['Thẻ HOJEONG to hơn: 8,5 × 6 cm (trước 8,1 × 5,3 cm). Khổ A4 vẫn 8 thẻ một tờ; khổ A5 vẫn 4 thẻ một tờ nhưng các thẻ nằm sát nhau, cắt theo đường viền chung.', '']] },
    { so: 92, ds: [['Thẻ HOJEONG khổ A5 in đúng kích thước 8,1 × 5,3 cm trên máy HP: app làm trang đúng khổ 5 × 7 inch mà máy HP nhận, nên iPhone không thu nhỏ nữa. Vẫn đặt giấy A5 vào khay; hộp in hiện "5 x 7 inch" là đúng.', '']] },
    { so: 91, ds: [['Thẻ HOJEONG có lịch sử: mỗi lần In hoặc gửi PDF, app lưu lại họ tên, mã thẻ, bộ phận và ảnh chân dung. Bấm "Thẻ đã in trước đây", tìm tên hoặc mã thẻ, chọn người rồi in lại ngay, không phải cắt ảnh hay gõ lại.', ''], ['Gõ mã thẻ đã cấp cho người khác, app hỏi lại trước khi in.', '']] },
    { so: 90, ds: [['App mở từ màn hình chính iPhone: bấm In sẽ tạo PDF ngay, hiện bảng "In". Bấm In, trong bảng hiện ra chọn In, rồi chọn đúng máy và khổ giấy. Không còn hiện nhầm bảng "Gửi PDF" khi muốn in.', '']] },
    { so: 89, ds: [['Ngay cạnh nút In luôn ghi rõ máy cần chọn: thẻ HOJEONG chọn máy màu HP Smart Tank 210 (khổ A4 hoặc A5, tỷ lệ 100%), in CCCD chọn máy đen trắng Brother (khổ A4). iPhone tự chọn máy in lần trước nên cần xem dòng này trước khi in.', ''], ['In thẻ HOJEONG mở thẳng hộp in, bỏ hộp nhắc gửi ra quán vì nhà đã có máy in màu. Nút gửi PDF vẫn giữ.', '']] },
    { so: 88, ds: [['Thẻ HOJEONG in được cả khổ A5 (4 thẻ một tờ, thẻ in đứng, đúng kích thước 8,1 × 5,3 cm). Chọn khổ A4 hoặc A5 ở đầu mục Thẻ HOJEONG, máy tự nhớ lần chọn trước. In CCCD vẫn khổ A4 như cũ.', '']] },
    { so: 87, ds: [['Tìm người ở tab Lao động: ngoài người tháng này, app tìm thêm cả người đã làm các tháng trước (mục "Đã làm các tháng trước" bên dưới kết quả).', ''],
      ['Chạm vào người tháng trước để xem lại thông tin, bảng công, phiếu tuần, phiếu tháng và các lần ứng / trả của tháng đó. Hồ sơ tháng trước chỉ để xem, không ghi ứng / trả hay sửa giờ.', '']] },
    { so: 86, ds: [['Phiếu tuần BEST: tuần chưa đủ 3 công hiện khối vàng "đang giữ lại". Người đi tăng cường được trả theo ngày thì người phụ trách bấm "Thanh toán tăng cường" để phiếu tính đủ tiền.', ''],
      ['Thẻ tuần đang giữ lại tiền ghi "Giữ lại" (trước đây ghi nhầm "Đã trả"). Bấm nhầm thì mở lại phiếu, chọn "Bỏ xác nhận".', ''],
      ['Sale xác nhận thanh toán tăng cường thì hiện trong khối thông báo của chủ, chạm vào là mở đúng phiếu tuần đó.', 'chu']] },
    { so: 85, ds: [['Ứng / trả gần đây: giữ ngón tay lên một dòng để sửa (số tiền, loại, ngày, người trả, ghi chú) hoặc xoá. Kế toán và chủ sửa được mọi dòng; sale chỉ sửa được dòng chính mình ghi trên app trong hôm nay.', ''],
      ['Có ô lọc theo tên; trong hồ sơ lao động bấm "Sửa ứng / trả ›" để xem ngay các dòng của người đó.', ''],
      ['Sale sửa hoặc xoá ứng / trả thì hiện trong khối thông báo của chủ, chạm vào là mở đúng người.', 'chu']] },
    { so: 84, ds: [['Lương tháng trước còn nợ người lao động không còn ghi thành dòng "Ứng" số âm ở sổ ứng trả nữa: máy ghi riêng ở sheet KY_TRUOC và cột "Nợ kỳ trước" trên bảng công. Sổ ứng trả chỉ còn tiền ứng / trả thật.', ''],
      ['Hồ sơ lao động: dưới số Còn phải trả có dòng "Gồm lương tháng trước chưa nhận …" khi người đó còn lương tháng trước.', '']] },
    { so: 83, ds: [['Tổng quan → Tiền & công nợ → Lịch thu tiền: số lớn mỗi dòng là giá trị hóa đơn gồm VAT, khớp bảng kê gửi công ty; dòng nhỏ "Thực nhận" là số về tay sau VAT và phí 5%.', 'chu'],
      ['Lịch thu tiền: tên kỳ rút gọn thành T9, T10 nên tên công ty không còn bị cắt; tổng thực nhận dự kiến nằm ở cuối danh sách.', 'chu']] },
    { so: 81, ds: [['Giả lập: bỏ mục "Toàn công ty" bị lặp; lãi từng công ty nằm ngay trong ô kết quả, chạm › để xem chi tiết.', 'chu']] },
    { so: 80, ds: [['Giả lập tài chính: ô kết quả hiện thẳng lãi của từng công ty (HOJEONG lãi, BEST lãi), đã trừ phần chi phí cố định chia theo doanh thu; cộng lại bằng lợi nhuận toàn công ty.', 'chu'],
      ['Giả lập: chạm › ở từng công ty để xem chi tiết và dòng "Nếu không có công ty này, toàn công ty còn…".', 'chu']] },
    { so: 79, ds: [['Giả lập tài chính: nhập riêng số người ca ngày và ca đêm ở phần Chỉ số chính (ca đêm lãi hơn hẳn ca ngày).', 'chu'],
      ['Giả lập: thêm ô "Công chủ nhật mỗi tháng" cho HOJEONG và BEST, tính đúng giá ×2 / ×2,3 và lương chủ nhật; BEST tách ngày thường và chủ nhật.', 'chu'],
      ['Giả lập: thưởng nhân viên kinh doanh tính gộp giờ mọi công ty của từng người (lũy tiến, thưởng mốc, phụ cấp 50 người); chuyên cần tính theo số công.', 'chu']] },
    { so: 78, ds: [['CCCD → Xử lý ảnh chờ trong CCCD TẠM: hiện thanh tiến độ, đếm giây và số ảnh đã đọc tới khi xong (trước đây dòng báo tự tắt sau 15 giây nên tưởng app đứng).', ''],
      ['Xong có bảng "Lần xử lý CCCD TẠM gần nhất" nằm cố định trong tab CCCD: bao nhiêu ảnh, bao nhiêu người kho đã có, bao nhiêu người lưu mới, ảnh lẻ, ảnh không đọc được.', ''],
      ['Ảnh của người kho đã có giờ chuyển riêng vào CCCD TẠM/ĐÃ XỬ LÝ/TRÙNG; ảnh đã ghép vào kho nằm ở ĐÃ XỬ LÝ. Không xoá ảnh nào.', ''],
      ['Hết ảnh chờ thì nút vẫn hiện, ghi "Không còn ảnh chờ trong CCCD TẠM".', '']] },
    { so: 77, ds: [['Kiểm tra vân tay: bỏ 2 tab "Ngày / Ngày +", thay bằng nút lọc Tất cả · Ca ngày · Ca đêm. Mỗi ngày tự lấy bản đủ giờ vào – ra; ngày mới chỉ có giờ vào thì ghi "Mới có giờ vào".', ''],
      ['Người làm ca đêm ghi rõ "Ra sáng 24/10" thay cho ký hiệu "+1".', ''],
      ['Bỏ chữ "khách" trong app, ghi đúng tên công ty (HOJEONG, BEST…).', '']] },
    { so: 76, ds: [['File vân tay HOJEONG gửi vào nhóm Zalo được máy tự lấy về và cập nhật vào bảng công (từ 12h trưa, 30 phút một lần). Thẻ "Kiểm tra vân tay" ghi "từ Zalo" khi bản mới nhất do máy tự lấy.', ''],
      ['Chọn file vân tay giống hệt bản đã cập nhật thì app báo "Vân tay đã ở bản mới nhất", không cập nhật lại. Cần gấp vẫn chọn file như cũ.', '']] },
    { so: 75, ds: [['Tổng quan: thanh chọn còn 3 mục (Lợi nhuận, Tiền & công nợ, Vendor & sale), có vạch ngăn cho dễ phân biệt. Giả lập tài chính chuyển thành nút riêng bên phải dòng "Cập nhật".', 'chu']] },
    { so: 74, ds: [['Giả lập: chi phí chung lấy theo sổ thu chi, các khoản trả trước (Claude, tool Zalo, proxy) chia đều theo tháng sử dụng; đồ mua một lần (máy quay, áo dép, ổ khoá) không tính.', 'chu']] },
    { so: 73, ds: [['Tổng quan có thêm mục "Giả lập": thử thay đổi đơn giá, chiết khấu cho nhân sự công ty, phí pháp nhân, số lao động, bảng lương theo ca, cách trả vendor… và xem ngay lợi nhuận toàn công ty mỗi tháng. Số liệu gốc lấy từ bảng công thực tế.', 'chu'],
      ['Giả lập có bảng độ nhạy (đổi 1 đơn vị thì lợi nhuận đổi bao nhiêu), giới hạn để không lỗ, vốn cần ứng trước, và lưu kịch bản để mở lại hoặc so sánh 2–3 phương án. Bấm nút (i) cạnh mỗi chỉ số để xem giải thích.', 'chu']] },
    { so: 72, ds: [['Ô "người đi làm" của HOJEONG (tab Lao động và Tổng quan) lấy theo bảng tổng cuối sheet "+" mới nhất trong file vân tay HOJEONG gửi, đã trừ người chuyển nhà; có tách ca ngày – ca đêm và số người đã chấm vào sáng hôm sau.', ''],
      ['Kiểm tra vân tay hiện đủ mọi dòng Đại Thành như file HOJEONG gửi; người đã chuyển nhà vẫn hiện, ghi rõ "đã chuyển nhà – bảng công không tính" và xếp cuối danh sách.', '']] },
    { so: 71, ds: [['Kiểm tra vân tay: các sheet ngày trong file HOJEONG được gộp thành 2 tab "Ngày" và "Ngày +" như file Excel, chọn ngày ở dải phía trên; ca qua đêm hiện trên cùng một trục giờ với ca ngày.', ''],
      ['Sheet chỉ có giờ vào (HOJEONG gửi buổi sáng) và người đang trong ca lúc lấy file không còn bị báo "thiếu giờ ra".', '']] },
    { so: 70, ds: [['Lao động: có nút "Kiểm tra vân tay" (BEST: "Kiểm tra chấm công") ngay dưới tên công ty. Bấm vào xem giờ vào – ra từng người theo file công ty gửi, đã lọc người Đại Thành, chia theo ngày như file Excel, người thiếu giờ được đưa lên đầu.', ''],
      ['Chọn file vân tay mới ở màn Kiểm tra vân tay là app tự đưa vào bảng công luôn. File nhầm công ty, sai kỳ hoặc cũ hơn dữ liệu đang có thì app báo rõ và không đụng vào bảng công.', ''],
      ['Bỏ nút "Báo sai giờ": người phụ trách công ty tự sửa giờ trong bảng công; người không phụ trách chỉ xem.', ''],
      ['Lao động: khối "Bảng công sửa khác vân tay" báo mỗi lần có người sửa giờ, trả công lẻ hoặc không tính ngày (trên app hay trên Sheet). Bấm "Đã xem" là ẩn.', 'chu'],
      ['Ảnh phiếu lương xuất trên iPhone không còn bị phóng to chữ; tên và số điện thoại người liên hệ luôn đi liền.', '']] },
    { so: 69, ds: [['Lao động: gõ tìm tên thì kết quả hiện ngay dưới ô tìm (các khối phía trên tạm ẩn). Công ty đang chọn không có ai khớp thì app tìm sang công ty kia.'], ['Hồ sơ lao động: có nút tìm ở góc trên để xem người khác luôn, không phải quay lại danh sách. Đang xem tuần nào thì người mới cũng mở đúng tuần đó.'], ['Phiếu tuần của những người còn phải trả được app tải sẵn, bấm vào là hiện ngay.'], ['Cập nhật vân tay / chấm công xong, nút chính đổi thành "Xong" để đóng hộp, không còn nút "Cập nhật lại".']] },
    { so: 68, ds: [['CCCD TẠM: máy chủ soát trước – người kho đã có thì tự chuyển ảnh gốc sang ĐÃ XỬ LÝ, điện thoại chỉ tải và ghép người chưa có trong kho.'], ['Nút "Mới" đổi tên thành "Xoá hết": bỏ cả lượt đang ghép trong 1 lần bấm (ảnh trên Drive không bị xoá).']] },
    { so: 67, ds: [['CCCD: không còn cắt lẹm vào thẻ – mép nào sát mép ảnh còn dính chữ, vân tay, mã QR thì app tự nới ra tới phần lề trống của thẻ.']] },
    { so: 66, ds: [['Số dư quỹ (Thu chi, Tổng quan): lương công nhân dù Hòa hay Long đi trả đều trừ vào quỹ. Cột Người trả chỉ để biết ai đi trả hôm đó; bỏ dòng "Sale trả hộ, chưa hoàn" và "Hoàn tiền sale trả hộ".', 'chu,ketoan']] },
    { so: 65, ds: [['CCCD: thẻ chụp nhỏ trên nền nhiều màu, nhiều sọc (chiếu cói, vải hoa) giờ tự cắt đúng thẻ, không còn để nguyên cả ảnh.']] },
    { so: 64, ds: [['CCCD: nút mới "Lưu kho" – lưu những người đã ghép đúng vào thư mục năm sinh mà không cần in.'], ['CCCD: xử lý ảnh chờ trong thư mục CCCD TẠM – app tải ảnh về, cắt ghép; bấm Lưu kho là vào đúng thư mục năm sinh, ảnh gốc chuyển sang CCCD TẠM/ĐÃ XỬ LÝ (không xoá).'], ['Mặt sau chụp từ VNeID (không có dòng mã ở dưới): app đọc mã QR để biết là của ai; QR mờ thì ghép theo ngày hết hạn trùng ngày sinh.'], ['Cặp ảnh chưa chắc cùng 1 người có nút "Đúng người"; chưa bấm thì Lưu kho bỏ qua cặp đó.']] },
    { so: 63, ds: [['In CCCD: mỗi người đúng 1 tờ A4 (hết trang trắng thừa), CCCD nằm giữa tờ giấy. PDF chia sẻ cũng đặt CCCD giữa tờ.']] },
    { so: 62, ds: [['In CCCD: bấm In là mở hộp in ngay, Safari không còn hỏi "chặn tự động in" và không in nhầm ra màn hình app. Nếu ảnh chưa chuẩn bị xong, app hiện nút "In N tờ" để bấm thêm 1 lần.'], ['Ghép tay: ô trống "+ Mặt sau / + Mặt trước" chạm vào để chọn đúng ảnh (ảnh lẻ trong lượt hoặc ảnh khác trong album); nút "Tách 2 ảnh" khi app ghép nhầm người; ảnh "xem lại" có nút đổi mặt ngay bên dưới.'], ['Cắt ảnh tốt hơn với thẻ đặt trên vải trắng / nền sáng và thẻ nhỏ trên chiếu có sọc chéo; ảnh mặt sau bị cắt mất chữ IDVNM vẫn đọc ra số để ghép đúng người.']] },
    { so: 61, ds: [['Phiếu lương tuần (HOJEONG, BEST) trình bày lại cho công nhân dễ hiểu: Tổng được hưởng → Đã nhận (mỗi lần ứng/trả ghi rõ ngày) → CÒN ĐƯỢC NHẬN. Số to trên phiếu giờ luôn là số còn phải trả thật.'], ['Tuần chưa hết: phiếu ghi "Tạm tính đến ngày …", ngày chưa tới để trống (không ghi Nghỉ), chuyên cần ghi "đang tính".']] },
    { so: 60, ds: [['Sửa lỗi bấm Cập nhật ngay đôi khi bị treo, nút mờ đi: giờ chậm nhất khoảng 10 giây app tự mở bản mới; mạng chậm thì nút sáng lại thành Thử lại.']] },

    { so: 58, ds: [['Thẻ HOJEONG: khi bấm Thêm người hoặc Chọn ảnh khác mà chọn trúng ảnh mặt trước CCCD, app tự nắn thẳng, cắt đúng phần chân dung và điền họ tên.'], ['Chọn trúng ảnh mặt sau CCCD thì app báo, không dán cả tấm thẻ vào khung ảnh.']] },
    { so: 57, ds: [['Trang CCCD có thêm mục Thẻ HOJEONG: tích người cần làm thẻ ra vào, app tự lấy ảnh chân dung trên CCCD và họ tên, sale gõ mã thẻ, chọn Production hoặc Quality.'], ['Mỗi thẻ đúng 8,1 × 5,3 cm, 8 thẻ một tờ A4; bấm nút chia sẻ để gửi PDF màu ra quán in (in 100%, không thu phóng).'], ['Ảnh chân dung chưa đẹp thì bấm Chọn ảnh khác; người chưa có CCCD trong lượt thì bấm Thêm người.']] },
    { so: 56, ds: [['Tab CCCD chuyển lên ngay cạnh tab Lao động.'], ['Trang CCCD có nút Chia sẻ (biểu tượng mũi tên lên, cạnh nút In): app tạo PDF mỗi người 1 trang A4 rồi gửi qua Zalo, email, Lưu vào Tệp… để mang ra quán in.'], ['Ảnh chọn trong kho và ảnh xem to cũng chia sẻ PDF được.']] },
    { so: 55, ds: [['Trang CCCD: nút Thêm ảnh, Làm lượt mới, In luôn nằm cố định dưới cùng, cuộn trang không bị trôi.'], ['Danh sách Đã lưu gần đây có ảnh nhỏ mặt CCCD; chạm vào để xem ảnh to rồi bấm In tờ này.'], ['Mới: Tìm ảnh trong kho theo Nam/Nữ, năm sinh từ–đến, số cuối CCCD; chạm ảnh để chọn nhiều người rồi in một lượt.'], ['Bỏ nút In bằng PDF (thừa): nếu máy không mở được hộp in, app tự đưa sang PDF.']] },
    { so: 54, ds: [['Trang CCCD: ảnh in mặc định đậm hơn, chữ đen rõ trên máy in laser.'], ['Khối "Chỉnh ảnh in" có 3 thanh kéo Sáng tối, Tương phản, Độ nét, áp cho tất cả ảnh.'], ['Mỗi người có nút "Chỉnh ảnh người này" để chỉnh riêng cả mặt trước và mặt sau.']] },
    { so: 53, ds: [['Ảnh CCCD cắt sát mép thẻ hơn: không còn dính nền bàn, sàn, và không méo khi ảnh chụp nghiêng.'], ['Thẻ đặt trên nền đá mài, vân gỗ hoặc chụp xoay dọc cũng tự cắt đúng.']] },
    { so: 52, ds: [['Ảnh CCCD in ra và lưu lên Drive sắc nét hơn: app thêm bước tăng độ nét chữ, không chỉ chỉnh độ sáng.']] },
    { so: 51, ds: [['Trang CCCD đọc số trên ảnh nhanh hơn nhiều: cả lượt ảnh chỉ mất vài giây.'], ['Tài khoản → Khoá đọc ảnh CCCD: chỗ dán khoá Cloud Vision và xem số lượt đã dùng trong tháng.', 'chu']] },
    { so: 50, ds: [['Trang CCCD tự đọc số trên từng ảnh để ghép đúng mặt trước với mặt sau của cùng một người, chọn ảnh theo thứ tự nào cũng được.'], ['Người đã có ảnh CCCD trong thư mục trên Drive thì app vẫn in nhưng không lưu thêm.'], ['Bấm dấu × trên mỗi người để bỏ cả 2 mặt, lỡ tay thì bấm Hoàn tác.'], ['Ảnh thẻ chụp dựng đứng trên nền tối nay đã tự cắt được.']] },
    { so: 49, ds: [['Thêm trang CCCD ở thanh dưới: chọn ảnh mặt trước và mặt sau trong album, app tự cắt, ghép và in mỗi người 1 tờ A4.'], ['Ảnh ghép tự lưu vào thư mục CCCD trên Drive, đúng giới tính và năm sinh.'], ['Ảnh nào app nhận nhầm mặt hoặc lộn đầu thì chạm vào ảnh để sửa.']] },
    { so: 46, ds: [['Phiếu lương BEST mở nhanh hơn.'], ['Ghi 2 khoản thu chi liền nhau: số dư tạm vẫn đúng.', 'chu,ketoan']] },
    { so: 45, ds: [['Sửa lỗi bấm làm mới đôi khi không ăn.'], ['Đầu tháng chưa chấm công: không dồn hết vào Nghỉ.']] },
    { so: 44, ds: [['Thu chi: số dư tính lại khác số tạm thì app nhắc.', 'chu,ketoan']] },
    { so: 43, ds: [['Ghi sổ xong dùng tiếp ngay, không phải chờ.', 'chu,ketoan'], ['Tổng quan: đổi tháng nhanh, không đổi tháng trên máy tính.', 'chu']] },
    { so: 42, ds: [['Mở app và phiếu lương nhanh hơn nhiều.'], ['Số cũ hiện ngay, số mới tự cập nhật ngầm.']] },
    { so: 41, ds: [['Tổng quan: tiền quỹ và công nợ vẽ thành thanh màu, nhìn là thấy tiền vào, tiền ra.', 'chu'], ['Tổng quan: bỏ bớt các bảng chữ dài khó đọc.', 'chu']] },
    { so: 40, ds: [['Mỗi lần cập nhật sẽ có hộp này giới thiệu điểm mới.'], ['Xem lại: Tài khoản → Có gì mới.']] },
    { so: 39, ds: [['Tab Lao động hiện số người đi làm hôm nay.'], ['Ai không đi làm tự vào mục "Nghỉ".'], ['Người cần kiểm tra hiện ngay đầu trang.'],
      ['Trang Tổng quan mới, dễ xem hơn.', 'chu'], ['Sửa tên "Hòang" thành "Hoàng".', 'chu']] }
  ];
  function moiCuaToi(tu, den) {   // các bản trong (tu, den], chỉ dòng hợp vai người dùng
    var vai = (S.toi || {}).vai || '';
    return BAN_MOI.filter(function (b) { return b.so > tu && b.so <= den; }).sort(function (a, b) { return b.so - a.so; }).map(function (b) {
      return { so: b.so, ds: b.ds.filter(function (x) { var v = Array.isArray(x) ? x[1] : x.v; return !v || v.split(',').indexOf(vai) >= 0; }).map(function (x) { return Array.isArray(x) ? x[0] : x; }) };
    }).filter(function (b) { return b.ds.length; });
  }
  // 21/10: hộp luôn đóng được (nút ×, chạm nền tối, nút Đã hiểu luôn hiện); nội dung dài thì cuộn bên trong
  // 06/11: mục mới dạng {i biểu tượng, t tiêu đề, m câu nói làm được gì, c [[tên cách dùng, các bước]], v vai}; trong bước: [[Nút trong app]], *Lựa chọn của điện thoại*
  function bmChu(t) { return esc(t).replace(/\[\[(.+?)\]\]/g, '<span class="bmk">$1</span>').replace(/\*(.+?)\*/g, '<i>$1</i>'); }
  function bmMuc(x) {
    if (typeof x === 'string') return '<ul class="bmds"><li>' + esc(x) + '</li></ul>';
    return '<div class="bmb">' + (x.i ? '<div class="bmt"><span class="bmn">' + esc(x.i) + '</span><b>' + esc(x.t) + '</b></div>' : '<div class="bmt"><b>' + esc(x.t) + '</b></div>') +
      (x.m ? '<div class="bmm">' + bmChu(x.m) + '</div>' : '') +
      (x.c || []).map(function (c) { return '<div class="bmct">' + esc(c[0]) + '</div><div class="bmm">' + bmChu(c[1]) + '</div>'; }).join('') + '</div>';
  }
  function hopMoi(ds, tieu) {   // ghi đủ mọi điểm mới; dài thì cuộn bên trong hộp
    var d = document.createElement('div'); d.className = 'bmoi';
    d.innerHTML = '<div class="bmh"><button class="bmx" aria-label="Đóng">×</button><h3>' + esc(tieu) + (ds.length === 1 ? ' <span class="bmv">Bản ' + ds[0].so + '</span>' : '') + '</h3><div class="bmc">' + ds.map(function (b) {
      var dt = b.ds.filter(function (x) { return typeof x !== 'string'; }), ch = b.ds.filter(function (x) { return typeof x === 'string'; });
      return (ds.length > 1 ? '<div class="meta" style="margin-top:12px;font-weight:700">Bản ' + b.so + '</div>' : '') + dt.map(bmMuc).join('') +
        (ch.length ? '<ul class="bmds">' + ch.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '');
    }).join('') + '</div><button class="btn" id="bmHieu">Đã hiểu</button></div>';
    document.body.appendChild(d);
    function dong() { d.remove(); }
    document.getElementById('bmHieu').onclick = dong;
    d.querySelector('.bmx').onclick = dong;
    d.onclick = function (e) { if (e.target === d) dong(); };
    return d;
  }
  function xemMoi() {   // gọi khi vào app
    if (!window.PB || !S.toi) return;
    var da = Number(doc('vlta_moi') || 0); if (!da) da = 38;   // lần đầu có hộp này (bản 40): cho xem cả bản 39
    if (PB.so <= da) return;
    var ds = moiCuaToi(da, PB.so);
    luu('vlta_moi', String(PB.so));
    if (!ds.length || document.querySelector('.bmoi')) return;
    hopMoi(ds, 'Có gì mới');
  }
  function hienBanMoi(so) {
    if (BM.mo) return;
    if (document.querySelector('.sheet')) { clearTimeout(BM.cho); BM.cho = setTimeout(function () { hienBanMoi(so); }, 3000); return; }
    BM.mo = 1;
    var d = document.createElement('div'); d.className = 'bmoi';
    d.innerHTML = '<div><div class="bmi">↻</div><h3>Có phiên bản mới</h3><div class="meta">Bản ' + so + ' · máy đang dùng bản ' + PB.so + '.<br>Bấm cập nhật để dùng bản mới nhất.</div><button class="btn" id="bmOk">Cập nhật ngay</button><div class="meta" id="bmTt"></div></div>';
    document.body.appendChild(d);
    document.getElementById('bmOk').onclick = function () {
      var b = this, tt = document.getElementById('bmTt'), lan = Number(doc('vlta_bm_' + so) || 0);
      var cho = lan && Date.now() - lan < 90000 ? 15 : 0;   // vừa bấm mà vẫn bản cũ: chờ máy chủ đưa bản mới lên (có đếm ngược)
      b.disabled = true; b.textContent = 'Đang cập nhật…'; tt.textContent = '';
      luu('vlta_bm_' + so, String(Date.now()));

  // ---------- 06/11: dòng ứng / trả có lỗi (cột Lỗi của sổ UNG_TRA) – thiếu người trả thì sale phụ trách người đó phải chọn ----------

    var GT = {
      chiso: ['Chỉ số chính', '<p>Những chỉ số thường thay đổi khi đàm phán với {KH} hoặc vendor. Mỗi ô có nút − / + hoặc gõ số trực tiếp; kết quả bên dưới tính lại ngay.</p><p>Ô nào khác số liệu thực tế sẽ chuyển màu xanh và ghi số thực tế bên dưới để so sánh. Bấm "Khôi phục số liệu thực tế" để trả về.</p>'],
      P: ['Đơn giá {KH} trả mỗi giờ', '<p>Số tiền {KH} trả cho Đại Thành cho 1 giờ làm việc ở hệ số 1 (ca ngày, thứ 2–7), chưa gồm VAT.</p><p>Các ca khác nhân hệ số theo bảng kê: tăng ca ngày ×1,5; ca đêm ×1,3; tăng ca đêm ×1,8; chủ nhật ×2 và ×2,3.</p>', function () { return 'Đang thiết lập ' + fT(S.p.P) + ' đ.'; }],
      cut: ['Chiết khấu nhân sự {KH}', '<p>Khoản Đại Thành trích lại cho bộ phận nhân sự của {KH} trên mỗi hóa đơn, tính trên tiền trước VAT.</p><p><b>Theo % hóa đơn:</b> ví dụ 2% của hóa đơn 100 triệu là 2 triệu.<br><b>Khoán đ/giờ:</b> một số tiền cố định cho mỗi giờ hệ số 1, giống cách làm với BEST (5.000 đ/giờ).</p><p>Với lao động của vendor, phần chiết khấu này được trừ vào giá trả vendor nên vendor chịu.</p>', function () { var r = tinh(S.p); return 'Đang thiết lập: mỗi tháng trích ' + fT(r.cut + r.revV * r.cutPct) + ' đ.'; }],
      fee: ['Phí pháp nhân', '<p>Công ty ký hợp đồng và xuất hóa đơn qua pháp nhân của bên khác. Bên đó nộp VAT thay và giữ lại một tỷ lệ % trên tiền hàng trước VAT (hiện 5%) rồi chuyển phần còn lại cho công ty.</p><p>Giảm được 1% phí tương đương tăng lợi nhuận 1% doanh thu.</p>', function () { var r = tinh(S.p); return 'Đang thiết lập ' + fD(S.p.fee, 1) + '%: mỗi tháng mất ' + fT(r.fee + r.revV * S.p.fee / 100) + ' đ.'; }],
      N: ['Lao động công ty đi làm mỗi ngày', '<p>Số lao động do công ty tuyển và trả lương, bình quân mỗi ngày làm thường. Với {KH}, số này đã gồm cả những ngày sale được tăng cường thêm người (ví dụ 2 người cố định, ngày sale thêm 1–2 người thì bình quân khoảng 2,2–2,5).</p><p>Số công ngày thường mỗi tháng = số lao động × số ngày làm thường. Công chủ nhật tính riêng ở Thiết lập khác.</p>', function () { var r = tinh(S.p); return fD(r.p.N, 1) + ' người × ' + fD(S.p.D, 0) + ' ngày + ' + fD(S.p.cnC || 0, 1) + ' công chủ nhật = ' + fT(r.cong) + ' công, khoảng ' + fT(r.gio) + ' giờ mỗi tháng.'; }],
      Nn: ['Lao động ca ngày mỗi ngày', '<p>Số lao động của công ty (không gồm vendor) đi ca ngày, bình quân mỗi ngày làm thường. Mặc định lấy theo bảng công thực tế.</p><p>Muốn ướm thêm người, gõ thẳng số người ca ngày và ca đêm dự kiến. Ca đêm {KH} trả hệ số 1,3 (tăng ca đêm 1,8) nên mỗi người ca đêm thường lãi gấp 2–3 lần người ca ngày; xem dòng "Lao động ca ngày / ca đêm" ở mục Độ nhạy.</p>', function () { var r = tinh(S.p); return 'Ngày ' + fD(r.p.Nn, 1) + ' + đêm ' + fD(r.p.Nd, 1) + ' = ' + fD(r.p.N, 1) + ' người · ' + fT(r.cong) + ' công, khoảng ' + fT(r.gio) + ' giờ mỗi tháng (gồm chủ nhật).'; }],
      Nd: ['Lao động ca đêm mỗi ngày', '<p>Số lao động của công ty (không gồm vendor) đi ca đêm, bình quân mỗi ngày làm thường. Mặc định lấy theo bảng công thực tế.</p><p>Ca đêm {KH} trả hệ số 1,3, tăng ca đêm 1,8; lương công nhân ca đêm cũng cao hơn nhưng phần còn lại vẫn lớn hơn ca ngày nhiều.</p>', function () { var r = tinh(S.p); return 'Đang thiết lập ' + fD(r.p.Nd, 1) + ' người ca đêm, chiếm ' + fD(r.p.N > 0 ? r.p.Nd / r.p.N * 100 : 0, 0) + '% tổng số người.'; }],
      G: ['Lao động vendor', '<p>Vendor là đơn vị cung ứng lại lao động cho công ty. Có 2 hình thức:</p><p><b>Giữ lại từ đơn giá</b> (cách đang làm với Đức, Hoàng, Quyền): trên mỗi giờ hệ số 1 công ty giữ lại một khoản (ví dụ 3.500 đ, hay gọi là "3,5 giá"), phần còn lại chuyển cho vendor để vendor trả lương công nhân của họ. Công ty vẫn là bên ứng tiền lương hằng tuần. Phí pháp nhân công ty chịu; chiết khấu nhân sự {KH} trừ vào phần của vendor.</p><p><b>Trả vendor theo giờ công:</b> công ty trả lương thẳng cho công nhân của vendor theo bảng lương của mình, và trả thêm vendor một khoản cố định mỗi giờ công (ví dụ 1.500 đ).</p><p>Cả hai cách công ty đều phải ứng lương trước, nên lương công nhân vendor được tính vào Vốn cần ứng trước. Số giờ của lao động vendor lấy từ bảng công, không nhập tay.</p>'],
      luong: ['Bảng lương công nhân theo ca', '<p>Lương công ty trả công nhân cho 1 công, theo tổng số giờ làm trong ngày và ca ngày/đêm, đúng như bảng cơ chế lương đang áp dụng (sheet CO_CHE). BEST có 2 dòng: lương bình quân mỗi công ngày thường và chủ nhật. Các dòng Chủ nhật dùng bảng lương chủ nhật.</p><p>Cột <b>Doanh thu / công</b> là số {KH} trả cho công đó (đơn giá × giờ × hệ số). Dòng <b>còn</b> là doanh thu trừ lương, chưa trừ phí pháp nhân, chiết khấu, thưởng.</p><p>Sửa từng mức, hoặc dùng ô "Điều chỉnh đồng loạt" để cộng/trừ cùng một số vào mọi mức.</p>'],
      dL: ['Điều chỉnh đồng loạt mọi mức', '<p>Cộng thêm số này vào tất cả các mức lương ở trên. Gõ số âm để giảm (ví dụ −10.000 là mỗi công giảm 10.000 đ, giống đợt điều chỉnh từ 15/10).</p>'],
      khac: ['Thiết lập khác', '<p>Các chỉ số ít khi thay đổi, mặc định lấy theo số liệu thực tế. Mở ra khi cần giả lập cơ cấu ca, số nhân viên kinh doanh, chi phí chung hoặc thời hạn {KH} thanh toán.</p>'],
      D: ['Ngày làm thường mỗi tháng', '<p>Số ngày thứ 2 – thứ 7 trong tháng có lao động đi làm. Dùng để quy đổi số liệu kỳ chưa đủ tháng thành cả tháng. Mặc định tính theo tỷ lệ ngày có công trong kỳ đang chạy. Chủ nhật tính riêng ở ô Công chủ nhật.</p>'],
      tc: ['Công có tăng ca', '<p>Tỷ lệ số công làm 10,5 tiếng (có 2,5 tiếng tăng ca) trên tổng số công. Tăng ca {KH} trả hệ số 1,5 (ngày) hoặc 1,8 (đêm).</p>', function () { return 'Thực tế: ' + fD(base().tc, 0) + '%.'; }],
      cnC: ['Công chủ nhật mỗi tháng', '<p>Số công làm ngày chủ nhật trong tháng của lao động công ty. Mặc định lấy theo bảng công thực tế quy ra tháng (không làm chủ nhật thì bằng 0).</p><p>Chủ nhật {KH} trả hệ số 2 (ca đêm 2,3 với HOJEONG) cho mọi giờ, lương công nhân theo bảng lương chủ nhật ở CO_CHE, nên mỗi công chủ nhật lãi gấp nhiều lần công ngày thường. HOJEONG: ca ngày/đêm của công chủ nhật chia theo tỷ lệ người ngày thường, có tăng ca thì tính 11 tiếng.</p>', function () { var r = tinh(S.p), c1 = clone(S.p); c1.cnC = (c1.cnC || 0) + 1; return fD(S.p.cnC || 0, 1) + ' công chủ nhật · mỗi công thêm ' + fDelta(tinh(c1).cty - r.cty) + ' đ lợi nhuận toàn công ty.'; }],
      ccC: ['Chuyên cần bình quân mỗi công', '<p>Thưởng chuyên cần (50.000 đ cho mỗi tuần đi đủ 6 công) quy ra bình quân mỗi công theo số liệu thực tế. Thêm người, thêm công thì tiền chuyên cần tăng theo.</p>', function () { var r = tinh(S.p); return fT(S.p.ccC || 0) + ' đ/công × ' + fT(r.cong) + ' công ≈ ' + fT(r.cc) + ' đ mỗi tháng.'; }],
      gioV: ['Giờ công lao động vendor mỗi tháng', '<p>Tổng số giờ do lao động của vendor làm trong tháng, lấy từ bảng công và quy ra tháng. Công ty không có vendor thì bằng 0. Gõ số để giả lập trường hợp có vendor.</p>'],
      S: ['Số nhân viên kinh doanh', '<p>Số nhân viên tuyển dụng và quản lý lao động. Mỗi người hưởng lương cơ bản cố định và thưởng theo giờ công của lao động mình tuyển, <b>gộp giờ ở mọi công ty</b>: 1.000 đ/giờ cho 2.000 giờ đầu, 1.500 đ/giờ từ giờ 2.001, thưởng mốc 5.000 / 7.000 / 10.000 giờ (+1 / +2 / +3 triệu), phụ cấp 1 triệu khi có từ 50 người đi làm từ 3 công.</p><p>Giờ chia cho từng người theo tỷ lệ trong bảng công thực tế của từng công ty (công ty mới chia đều). Tổng thưởng chia lại cho các công ty theo tỷ lệ giờ để tính lãi từng công ty. Giờ của lao động vendor không tính thưởng. Số nhân viên khác số người đang có trong bảng công thì giờ chia đều.</p>', function () { var r = tinh(S.p); return r.th.ct.map(function (c) { return esc(c.ten) + ': ' + fT(c.gio) + ' giờ' + (c.nguoi ? ', khoảng ' + fT(c.nguoi) + ' người từ 3 công' : '') + ' → ' + fT(c.tien) + ' đ' + (c.pc ? ' (gồm phụ cấp)' : ''); }).join('<br>') + '<br>Tổng thưởng ' + fT(r.th.tong) + ' đ mỗi tháng.'; }],
      base: ['Lương cơ bản mỗi nhân viên kinh doanh', '<p>Lương cố định hằng tháng, không phụ thuộc sản lượng. Đây là chi phí toàn công ty, không gắn với một công ty cụ thể.</p>'],
      CP: ['Chi phí chung mỗi tháng', '<p>Các khoản chi lặp lại hằng tháng, không gắn với công ty nào: xăng xe đưa đón lao động, tiếp khách, thưởng người giới thiệu, proxy Zalo… Lấy từ sổ thu chi.</p><p>Khoản trả trước cho nhiều tháng (Claude, tool Zalo 12 tháng, proxy 6 tháng) được chia đều cho các tháng sử dụng, theo cột "Chia cho số tháng" của sheet DANH_MUC.</p><p>Không gồm mua sắm ban đầu (máy quay, áo dép, găng tay, ổ khóa), đánh dấu ở cột "Trang bị ban đầu". Mua bổ sung khi thiếu, mất thì ghi khoản "Chi phí mua bổ sung áo, dép, găng tay, ổ khoá" và được tính vào chi phí chung. Tháng 9 có nhiều mua sắm ban đầu nên không tính.</p>', function () { return cpGhi + '.'; }],
      C: ['{KH} thanh toán sau kỳ', '<p>Số ngày từ khi kết thúc kỳ công đến khi {KH} thanh toán. Ảnh hưởng đến số tiền lương công ty phải ứng trước.</p>'],
      loinhuan: ['Lợi nhuận toàn công ty', '<p>Số tiền còn lại mỗi tháng của cả công ty sau khi trừ mọi chi phí: lương công nhân, trả vendor, phí pháp nhân, chiết khấu, thưởng và lương cơ bản nhân viên kinh doanh, chi phí chung.</p><p>Bên dưới là <b>lãi của từng công ty</b>: đã trừ phần chi phí cố định chia theo tỷ lệ doanh thu, cộng lại đúng bằng số lớn.</p><p>Công ty đang giả lập dùng số thiết lập ở trên; các công ty khác dùng số liệu thực tế. Đây là công cụ so sánh phương án; số chính thức xem ở tab Lợi nhuận.</p>'],
      moigio: ['Lợi nhuận từ lao động công ty', '<p>Phần lợi nhuận riêng của công ty đang xem, tính trên lao động do công ty tự trả lương (không gồm vendor), sau khi trừ lương, phí pháp nhân, chiết khấu và thưởng nhân viên kinh doanh, nhưng chưa trừ chi phí cố định toàn công ty.</p><p>Chia cho số giờ, số công, số lao động để biết mỗi giờ / mỗi công / mỗi người đem lại bao nhiêu.</p>'],
      cty: ['Toàn công ty', '<p><b>Lãi của từng công ty</b> = doanh thu trừ mọi chi phí trực tiếp (lương công nhân, vendor, phí pháp nhân, chiết khấu, thưởng nhân viên kinh doanh theo giờ), rồi trừ tiếp phần chi phí cố định công ty đó phải gánh.</p><p><b>Chi phí cố định</b> (lương cơ bản nhân viên kinh doanh và chi phí chung) chia cho các công ty theo tỷ lệ doanh thu trước VAT. Cộng lãi các công ty đúng bằng lợi nhuận toàn công ty.</p><p>Dòng <b>"Nếu không có …"</b> cho biết bỏ hẳn công ty đó thì toàn công ty còn bao nhiêu: chi phí cố định vẫn phải trả nên công ty nhỏ có lãi riêng thấp vẫn có thể rất đáng giữ. Chạm › để xem chi tiết.</p>'],
      phanbo: ['Phân bổ doanh thu', '<p>Doanh thu của {KH} được chia thành những khoản nào. Thanh màu cho thấy tỷ trọng từng khoản so với doanh thu.</p>'],
      anhhuong: ['Độ nhạy của lợi nhuận', '<p>Bảng tra cứu: nếu một chỉ số thay đổi đúng một đơn vị nhỏ (1.000 đ đơn giá, 1 lao động, 1% phí…) và mọi thứ khác giữ nguyên, thì lợi nhuận toàn công ty mỗi tháng tăng hay giảm bao nhiêu.</p><p>Xếp từ ảnh hưởng mạnh đến yếu để biết nên ưu tiên đàm phán điểm nào. Muốn biết nhiều đơn vị thì nhân lên. Đây là bảng chỉ đọc; muốn đổi kịch bản thì sửa ở phần Thiết lập giả lập.</p>'],
      gioihan: ['Giới hạn để toàn công ty không lỗ', '<p>Với các chỉ số khác giữ như đang thiết lập, mỗi dòng cho biết một chỉ số có thể đi tới mức nào thì lợi nhuận toàn công ty về 0.</p>'],

      von: ['Vốn cần ứng trước', '<p>Lương công nhân trả hằng tuần, trong khi {KH} thanh toán sau khi hết kỳ 30 ngày cộng thêm thời hạn công nợ. Vì vậy công ty phải ứng trước nhiều tháng lương trước khi tiền về. Số này cộng cả các công ty khác.</p><p>So với vốn góp cho biết còn dư bao nhiêu để nhận thêm lao động hoặc ký thêm công ty mới.</p>'],
      kichban: ['Kịch bản đã lưu', '<p>Lưu lại một bộ thiết lập (giá, chiết khấu, số lao động…) kèm tên để mở lại sau hoặc đặt 2–3 kịch bản cạnh nhau so sánh. Kịch bản lưu trên Google Sheet (bảng "VIEC LAM TAM AN - APP", sheet KICH_BAN) nên máy nào đăng nhập tài khoản chủ cũng thấy.</p><p>Kết quả của kịch bản luôn tính lại trên số liệu thực tế mới nhất của các công ty khác; dòng "Lưu ngày… trên số liệu…" cho biết lúc lưu đang dùng kỳ nào.</p>']
